<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fechô</title>
<meta name="theme-color" content="#15171a">
<meta name="versao" content="2026-10-29.11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fechô">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de balcão mobile-first; faixa grafite no topo, coluna única de até 760px, ações em dourado */
:root{
  --bg:#f2f0eb; --surface:#ffffff; --surface-2:#ebe8e1; --line:#d8d3c8; --fg:#23262a; --muted:#686b70;
  --gold:#8f6c17; --gold-soft:#f2e8cc; --on-gold:#ffffff;
  --head-bg:#23262a; --head-fg:#efece5; --head-muted:#a7a9ad; --head-gold:#d6b25a;
  --ok:#2b7546; --ok-soft:#dbeee1; --warn:#9c5a0c; --warn-soft:#f7e6cd; --bad:#a33131; --bad-soft:#f5dada; --info:#2b5a86; --info-soft:#dce7f2;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#16181b; --surface:#202327; --surface-2:#292d32; --line:#363a41; --fg:#ebe8e1; --muted:#9a9ea5;
  --gold:#d6b25a; --gold-soft:#3a3220; --on-gold:#1a1b1d;
  --head-bg:#0e0f11; --head-fg:#ebe8e1; --head-muted:#8d9096; --head-gold:#d6b25a;
  --ok:#6cbf8a; --ok-soft:#1e3326; --warn:#e2a457; --warn-soft:#3a2b17; --bad:#e97c7c; --bad-soft:#3c2121; --info:#80b1de; --info-soft:#1c2b3a;
  color-scheme:dark }}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.02em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head-bg);color:var(--head-fg)}
.top-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:140px;flex:1}
.brand b{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.01em}
.brand b i{font-style:normal;color:var(--head-gold)}
.brand span{font-size:12px;color:var(--head-muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.nav button{flex:none;background:transparent;border:1px solid transparent;color:var(--head-muted);padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px}
.nav button[aria-current="page"]{color:var(--head-fg);border-color:#ffffff26}
.nav .novo{background:var(--head-gold);color:#1a1b1d;font-weight:600}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg);min-height:42px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.wa{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.full{width:100%}
.link{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;font-weight:600;text-decoration:underline}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-aguardando,.st-pendente{background:var(--warn-soft);color:var(--warn)}
.st-pago,.st-embalado,.st-coletado{background:var(--info-soft);color:var(--info)}
.st-faturado{background:var(--gold-soft);color:var(--gold)}
.st-entregue,.st-ativo{background:var(--ok-soft);color:var(--ok)}
.st-cancelado,.st-inativo{background:var(--bad-soft);color:var(--bad)}

.pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:620px){.pipe{grid-template-columns:repeat(6,1fr)}}
.pipe button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.pipe button b{font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.pipe button span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pipe button.alerta b{color:var(--warn)}
.kpi{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.kpi b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.tile.gold b{color:var(--gold)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}

.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;width:100%}
.card:hover{border-color:var(--gold)}
.card-top,.card-mid{display:flex;justify-content:space-between;gap:10px;align-items:center;min-width:0}
.card-mid strong{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card-mid .total{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;flex:none}
.card-sub{font-size:13px;color:var(--muted)}
.prog{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.prog i{height:4px;border-radius:2px;background:var(--surface-2)}
.prog i.on{background:var(--gold)}
.prog.done i.on{background:var(--ok)}
.prog.cancel i{background:var(--bad-soft)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box.destaque{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.notice{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;font-size:13.5px;color:var(--muted)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.grid3 .f:first-child{grid-column:1/-1}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:42px}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold);outline:none}
.f small{color:var(--muted);font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:9px;padding:4px}
.seg.dois{grid-template-columns:1fr 1fr}
.seg button{border:0;background:transparent;border-radius:7px;padding:8px 6px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px #0000001f}
.item{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.item-h{display:flex;justify-content:space-between;align-items:center}
.erro{color:var(--bad);font-size:14px;font-weight:500}
.ok-msg{color:var(--ok);font-size:14px;font-weight:500}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.barra-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.barra-in .tot{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.barra-in .tot b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}

.itens{width:100%;border-collapse:collapse;font-size:14px}
.itens td{padding:6px 0;border-bottom:1px solid var(--surface-2);vertical-align:top}
.itens td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.totais{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.totais .g{font-family:var(--f-display);font-size:20px;font-weight:700}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;font-size:14px;max-height:340px;overflow:auto;width:100%;min-height:120px;resize:vertical}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:12px 1fr;gap:10px;padding-bottom:10px;position:relative}
.hist li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:5px}
.hist li:not(:last-child)::after{content:"";position:absolute;left:4.5px;top:16px;bottom:0;width:1px;background:var(--line)}
.hist small{color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
a{color:var(--gold)}
.tabw{overflow-x:auto}
.tab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tab th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tab td{padding:8px;border-bottom:1px solid var(--surface-2);white-space:nowrap}
.tab .r{text-align:right}
.tab tfoot td{font-weight:700;border-bottom:0}
.check{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 6px;color:var(--fg)}
button.rk{cursor:pointer}
button.rk:hover{background:var(--surface-2)}
.pos{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
li:first-child .pos{color:var(--gold)}
.rk-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.rk-top{display:flex;justify-content:space-between;gap:10px;min-width:0}
.rk-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-val{font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.rk-bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.rk small{color:var(--muted);font-size:12.5px}
.rk-go{color:var(--muted);font-size:22px;line-height:1}
.sug{display:flex;flex-direction:column;gap:4px}
.sug:empty{display:none}
.passos{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.passos li::marker{font-family:var(--f-display);font-weight:700;color:var(--gold)}
.passos p{color:var(--muted);font-size:14px;margin-top:2px}
.papeis{margin:0;display:flex;flex-direction:column;gap:10px}
.papeis div{padding:8px 10px;border-radius:8px}
.papeis div.eu{background:var(--gold-soft)}
.papeis dt{font-weight:600}
.papeis dd{margin:2px 0 0;color:var(--muted);font-size:14px}
.sug-i{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.sug-i:hover{border-color:var(--gold)}
.sug-i span{color:var(--muted);font-size:13px;white-space:nowrap}

.auth{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.auth .marca{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1}
.auth .marca i{font-style:normal;color:var(--gold)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.confirma{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:10px 12px}

/* ===== Visual comercial: cabeçalho escuro com filete dourado, tipografia forte, cartões elevados ===== */
:root{--r:14px;--sombra:0 1px 2px #0000000f,0 10px 28px #0000000f;--sombra-alta:0 2px 4px #00000014,0 16px 36px #0000001f;
  --gold-grad:linear-gradient(135deg,#e2c06a 0%,#c99a2e 55%,#a87b16 100%);--ouro:#c99a2e}
@media (prefers-color-scheme: dark){:root{--sombra:0 1px 2px #0000004d,0 10px 28px #00000059;--sombra-alta:0 2px 4px #00000066,0 16px 36px #00000073}}
body{background:radial-gradient(1200px 400px at 50% -80px,color-mix(in srgb,var(--ouro) 10%,transparent),transparent 70%) no-repeat,var(--bg);font-size:15.5px}
.top{background:linear-gradient(180deg,#1b1d21 0%,#121316 100%);border-bottom:3px solid var(--ouro);box-shadow:0 6px 22px #00000040}
.top-in{max-width:1040px;padding-block:12px}
.brand b{font-size:34px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b i{color:var(--ouro)}
.brand span{font-size:11.5px;letter-spacing:.14em;color:#b9bbc0}
.nav{gap:6px}
.nav button{border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;letter-spacing:.01em;color:#c4c6ca;transition:background .15s,color .15s}
.nav button:hover{background:#ffffff14;color:#fff}
.nav button[aria-current="page"]{background:#ffffff1f;color:#fff;border-color:transparent;box-shadow:inset 0 -2px 0 var(--ouro)}
.nav .novo{background:var(--gold-grad);color:#17181a;font-weight:700;box-shadow:0 4px 14px #c99a2e66;text-transform:uppercase;letter-spacing:.04em}
.nav .novo:hover{background:var(--gold-grad);color:#17181a;filter:brightness(1.06)}
.nav .atualiza{color:var(--ouro)}
.wrap{max-width:1040px;padding-top:26px;gap:20px}
h1{font-size:34px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
h1::after{content:"";display:block;width:54px;height:4px;background:var(--gold-grad);border-radius:2px;margin-top:8px}
h2{font-size:22px;letter-spacing:.02em}
.eyebrow{color:var(--gold);letter-spacing:.14em;font-size:11.5px}
.btn{border-radius:11px;min-height:46px;padding:11px 20px;font-weight:700;letter-spacing:.01em;box-shadow:0 1px 2px #0000000d;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #00000026}
.btn.pri{background:var(--gold-grad);border-color:#a87b16;color:#17181a;text-transform:uppercase;letter-spacing:.05em;font-size:14px;box-shadow:0 6px 18px #c99a2e59}
.btn.wa{box-shadow:0 6px 16px #2b754640}
.btn.sm{min-height:36px;padding:7px 13px;font-size:13.5px;border-radius:9px}
.btn.pri.sm{letter-spacing:.04em;font-size:12.5px}
.box{border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);padding:20px;box-shadow:var(--sombra);gap:14px}
.box.destaque{box-shadow:var(--sombra),inset 4px 0 0 var(--ouro)}
.tiles{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.tile{border:0;border-top:4px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sombra);gap:6px}
.tile.gold{border-top-color:var(--ouro);background:linear-gradient(180deg,color-mix(in srgb,var(--ouro) 14%,var(--surface)),var(--surface))}
.tile b{font-size:clamp(24px,2.5vw,32px);line-height:1.05;letter-spacing:.01em;white-space:nowrap}
.tile .muted{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.pipe{gap:10px}
.pipe button{border-radius:var(--r);padding:14px 14px;box-shadow:var(--sombra);border-color:transparent}
.pipe button b{font-size:32px}
.pipe button span{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.pipe button[aria-pressed="true"]{border-color:var(--ouro);box-shadow:var(--sombra),inset 0 0 0 2px var(--ouro)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.card{border-radius:var(--r);padding:16px 18px;box-shadow:var(--sombra);border-color:transparent;gap:8px;transition:transform .14s,box-shadow .14s}
button.card:hover,a.card:hover{transform:translateY(-2px);box-shadow:var(--sombra-alta);border-color:var(--ouro)}
.card-mid strong{font-size:17px}
.card-mid .total{font-size:22px;color:var(--gold)}
.pill{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px}
.chip{border-radius:999px;padding:8px 16px;font-weight:600;box-shadow:var(--sombra);border-color:transparent}
.chip[aria-pressed="true"]{background:#17181a;color:var(--ouro);box-shadow:inset 0 -3px 0 var(--ouro)}

  </div>
</header>
<main id="app" class="wrap" aria-live="polite"><div class="empty">Carregando…</div></main>
<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Configuração ===== */
const SUPABASE_URL='https://ucuvtorgapdvawitwzfc.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjdXZ0b3JnYXBkdmF3aXR3emZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjgxMTgsImV4cCI6MjEwODgwNDExOH0.9H_1BVTehBYKEZnlkf2J_aUbqx35nPY7JPJkraqZfKo';

const ETAPAS=[['aguardando','Aguardando pagamento'],['pago','Pago'],['embalado','Embalado'],['faturado','NF emitida'],['coletado','Em entrega'],['entregue','Entregue']];
const IDX=Object.fromEntries(ETAPAS.map((e,i)=>[e[0],i]));
const LABEL={...Object.fromEntries(ETAPAS),cancelado:'Cancelado'};
const MODOS={motoboy:'Motoboy por app',transportadora:'Correios / transportadora',retirada:'Retirada na loja'};
const APPS=['Lalamove','Uber Direct','99Entrega','Loggi','Correios','Transportadora','Outro'];
const TAMS=['PP','P','M','G','GG','XG','XGG','2','4','6','8','10','12','14','16','36','38','40','42','44','Único'];

const comErro=(pa,c)=>{const f=COM_FAIXA[pa];return f&&!(c>=f[0]&&c<=f[1])?`Comissão do ${PAPEIS[pa].toLowerCase()}: de ${f[0]}% a ${f[1]}%.`:''};

const mesAtual=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
/* versão publicada: o app confere sozinho se há uma nova e avisa no topo */
const VERSAO=(document.querySelector('meta[name=versao]')||{}).content||'';
async function checaVersao(){
  if(!VERSAO)return;
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const t=await r.text(),m=t.match(/<meta name="versao" content="([^"]+)"/);
    const el=document.getElementById('upd');
    if(m&&m[1]!==VERSAO&&el)el.hidden=false;
  }catch(e){}
}
const S={uid:null,email:'',perfil:null,lojas:[],perfis:[],pedidos:[],carregado:false,recuperar:false,
  view:'painel',loja:'todas',etapa:'ativos',busca:'',atual:null,form:null,erro:'',confirmaCancel:false,busy:false,
  auth:{modo:'entrar',erro:'',ok:''},mes:mesAtual(),res:null,resMes:null,resLoja:null,eq:{},lj:{},conv:null,convites:[],cv:null,reset:{},clientes:[],cli:null,cliBusca:'',cliBuscaForm:'',cx:{},cart:null,cartEq:null};

/* ===== utilidades ===== */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const toNum=v=>{if(typeof v==='number')return v;const s=String(v||'').trim().replace(/[^\d,.-]/g,'');if(!s)return 0;const n=s.includes(',')?parseFloat(s.replace(/\./g,'').replace(',','.')):parseFloat(s);return isFinite(n)?n:0};
const precoTxt=n=>n?Number(n).toFixed(2).replace('.',','):'';
const pct=n=>`${String(+n||0).replace('.',',')}%`;
const nowIso=()=>new Date().toISOString();
const foneWa=t=>{let d=String(t||'').replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;return d};
const foneFmt=t=>{const d=String(t||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'');if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return t||''};
const primeiro=n=>String(n||'').trim().split(/\s+/)[0]||'';
const quando=iso=>{if(!iso)return'';const d=new Date(iso),m=(Date.now()-d)/60000;if(m<1)return'agora';if(m<60)return`há ${Math.floor(m)} min`;const hm=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(new Date().toDateString()===d.toDateString())return`hoje, ${hm}`;return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+', '+hm};
const lojaDe=id=>S.lojas.find(l=>l.id===id);
const nomeLoja=l=>l?`${l.marca||''} ${l.nome||''}`.trim():'Loja';
const pedido=id=>S.pedidos.find(p=>p.id===id);
const perfilDe=id=>S.perfis.find(p=>p.id===id)||(S.perfil&&S.perfil.id===id?S.perfil:null);
const normPed=p=>({...p,subtotal:+p.subtotal||0,frete:+p.frete||0,total:+p.total||0,comissao_vend:+p.comissao_vend||0,comissao_gerente:+p.comissao_gerente||0,gerentes:p.gerentes||[],supervisores:p.supervisores||[],historico:p.historico||[],cliente:p.cliente||{},itens:p.itens||[],nf:p.nf||{},entrega:p.entrega||{},pagamento:p.pagamento||{},aprovacao:p.aprovacao||{}});
const normPerfil=p=>p&&({...p,comissao:p.comissao==null?null:+p.comissao});

/* papéis */
const ativo=()=>!!S.perfil&&S.perfil.status==='ativo';
const papel=()=>ativo()?S.perfil.papel:null;
const ehDono=()=>papel()==='proprietario';
const veTodas=()=>papel()==='proprietario'||papel()==='supervisor';
const ehGerente=()=>papel()==='gerente';
const podeVender=()=>veTodas()||(ativo()&&(!!S.perfil.loja_id||S.perfil.papel==='afiliado'));
const lojasVisiveis=()=>veTodas()||papel()==='afiliado'?S.lojas.filter(l=>l.ativa!==false):S.lojas.filter(l=>l.id===S.perfil?.loja_id);
const quemVende=p=>p.vendedor_nome||(p.afiliado_nome?`Afiliado ${p.afiliado_nome}`:'venda da loja');
const veComissao=p=>veTodas()||p.vendedor_id===S.uid||p.afiliado_id===S.uid||(p.gerentes||[]).some(g=>g.id===S.uid);

let tt;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2800)}
function erroTxt(e){const c=e&&e.code;if(c==='42501')return'Sem permissão para esta ação.';if(c==='23514')return'Valor fora do permitido. Comissão: vendedor de 2% a 5%, gerente de 1% a 2%.';if(c==='P0001'&&e.message)return e.message;if(c==='23505')return'Já existe um registro igual (sigla repetida ou outro gerente ativo nesta loja).';return'Não foi possível salvar. Verifique a conexão e tente de novo.'}
async function gravar(fn,okMsg){
  if(S.busy)return null;S.busy=true;
  try{const r=await fn();if(r.error){toast(erroTxt(r.error));return null}if(okMsg)toast(okMsg);return r.data??true}
  catch(e){toast('Sem conexão. Tente de novo.');return null}
  finally{S.busy=false}
}

/* ===== mensagens ao cliente ===== */
function linhasItens(p){return(p.itens||[]).map(i=>`• ${i.qtd}x ${i.desc}${i.ref?` (Ref. ${i.ref})`:''}${i.tam?` – Tam. ${i.tam}`:''} – ${brl(i.preco*i.qtd)}${i.obs?`\n   Obs.: ${i.obs}`:''}`).join('\n')}
function enderecoTxt(c){return[c.endereco,c.bairro,c.cidade].filter(Boolean).join(', ')+(c.cep?` – CEP ${c.cep}`:'')}
function msgResumo(p){
  const l=lojaDe(p.loja_id),c=p.cliente;
  const frete=p.modo==='retirada'?`Retirada na loja ${l?l.nome:''}: sem frete`:`Frete (${p.modo==='motoboy'?'entrega por motoboy':'envio'}): ${brl(p.frete)}`;
  let t=`Olá, ${primeiro(c.nome)}! Aqui é ${p.vendedor_nome||p.afiliado_nome||'a equipe'}, da loja ${nomeLoja(l)}.\n\nResumo do seu pedido nº ${p.numero}:\n${linhasItens(p)}\n\nSubtotal: ${brl(p.subtotal)}\n${frete}\n*Total: ${brl(p.total)}*`;
  if(p.modo!=='retirada'&&enderecoTxt(c))t+=`\n\nEntrega em: ${enderecoTxt(c)}`;
  const fp=(p.pagamento&&p.pagamento.forma)?txtPagamento(p):'';
  t+=p.link_pagamento?`\n\n${fp?`Forma de pagamento: *${fp}*\nLink seguro para pagar:`:'Pague com cartão ou Pix por este link seguro:'}\n${p.link_pagamento}\n\nAssim que o pagamento for confirmado, separamos seu pedido e enviamos a nota fiscal.`:`\n\n${fp?`Forma de pagamento: *${fp}*. Em seguida envio o link para você pagar.`:'Em seguida envio o link para pagamento com cartão ou Pix.'}`;
  return t}
function msgAtual(p){
  const c=p.cliente,l=lojaDe(p.loja_id),nf=p.nf,e=p.entrega;
  switch(p.status){
    case'aguardando':return msgResumo(p);
    case'pago':case'embalado':return`${primeiro(c.nome)}, pagamento do pedido nº ${p.numero} confirmado! Já estamos separando seus produtos. Assim que a nota fiscal for emitida, envio aqui.`;
    case'faturado':{let t=`Seu pedido nº ${p.numero} foi faturado.\nNota fiscal nº ${nf.numero||''}`;if(nf.chave)t+=`\nChave de acesso: ${nf.chave}`;if(nf.link)t+=`\nBaixe a nota: ${nf.link}`;t+=p.modo==='retirada'?`\n\nJá pode retirar na loja ${nomeLoja(l)}.`:`\n\nAvisarei assim que sair para entrega.`;return t}
    case'coletado':{let t=`Seu pedido nº ${p.numero} saiu para entrega${e.app?` via ${e.app}`:''}.`;if(e.link)t+=`\nAcompanhe a entrega: ${e.link}`;else if(e.codigo)t+=`\nCódigo de rastreio: ${e.codigo}`;return t}
    case'entregue':return`Pedido nº ${p.numero} entregue. Obrigado pela compra, ${primeiro(c.nome)}! Qualquer dúvida, é só chamar aqui.`;
    default:return`Olá, ${primeiro(c.nome)}. O pedido nº ${p.numero} foi cancelado. Qualquer dúvida, estou à disposição.`}
}

/* ===== dados ===== */
async function carregarTudo(){
  S.carregado=false;render();
  const [pf,lj]=await Promise.all([sb.from('perfis').select('*').eq('id',S.uid).maybeSingle(),sb.from('lojas').select('*').order('nome')]);
  S.perfil=normPerfil(pf.data);S.lojas=lj.data||[];
  if(ativo()){
    if(papel()==='afiliado'){await Promise.all([carregarMinhasVendas(),carregarPedidos(),carregarConfig()])}
    else await Promise.all([carregarPedidos(),carregarClientes(),carregarRegras(),carregarConfig(),veTodas()||ehGerente()?carregarPerfis():null,veTodas()||ehGerente()?carregarAfiliados():null]);
    if(!veTodas()&&S.perfil.loja_id)S.loja=S.perfil.loja_id;
    if(papel()!=='afiliado')assinar();
  }
  S.carregado=true;render();
}
async function carregarPedidos(){const{data,error}=await sb.from('pedidos').select('*').order('criado_em',{ascending:false}).limit(500);if(error){toast('Não foi possível carregar os pedidos.');return}S.pedidos=(data||[]).map(normPed)}
async function carregarAfiliados(){try{const{data}=await sb.rpc('lista_afiliados');S.afiliados=data||[]}catch(e){S.afiliados=[]}}
async function carregarConfig(){try{const{data}=await sb.from('config').select('*').eq('chave','afiliado').maybeSingle();S.config=Object.assign({prazo_dias:7},data&&data.valor||{})}catch(e){S.config={prazo_dias:7}}}
async function carregarMinhasVendas(){try{const{data,error}=await sb.rpc('minhas_vendas_afiliado');if(error)throw error;S.minhas=data||{prazo_dias:7,pedidos:[]};const l=await sb.rpc('meu_link_afiliado');S.linksAf=Array.isArray(l.data)?l.data:[]}catch(e){S.minhas={prazo_dias:7,pedidos:[],erro:true};S.linksAf=[]}}
const dtBR=iso=>iso?new Date(iso).toLocaleDateString('pt-BR'):'';
function sitCom(status,entregueEm,pagoEm,prazo){
  if(status==='cancelado')return{k:'cancelado',txt:'Pedido cancelado'};
  if(pagoEm)return{k:'paga',txt:'Paga em '+dtBR(pagoEm)};
  if(status!=='entregue'||!entregueEm)return{k:'andamento',txt:'Pedido em andamento'};

  return lib<=Date.now()?{k:'liberada',txt:'Liberada para pagamento'}:{k:'prazo',txt:'Libera em '+dtBR(new Date(lib).toISOString())}}
let vTm;

async function carregarCart(){if(S.cartCarregando)return;S.cartCarregando=true;try{const{data,error}=await sb.rpc('minha_carteira');if(error)throw error;S.cart=data||{erro:true}}catch(e){S.cart={erro:true}}S.cartCarregando=false;if(['painel','carteira'].includes(S.view)||papel()==='afiliado')render()}

  const C=S.cart;if(!C||C.erro)return'';
  const disp=+C.disponivel||0,apos=+C.a_liberar||0,sol=+C.em_saque||0;

  <div class="card-mid"><strong style="white-space:normal">Disponível para sacar</strong><span class="total">${brl(disp)}</span></div>
  <div class="card-sub">A receber (pedidos ainda no prazo): <b>${brl(apos)}</b>${sol?` · saque em análise: ${brl(sol)}`:''}</div></button>`}

async function carregarCarteira(){

  if(veTodas()){try{const{data,error}=await sb.rpc('carteiras_resumo');if(error)throw error;S.cartEq=data||{pessoas:[],saques:[]}}catch(e){S.cartEq={pessoas:[],saques:[],erro:true}}}
}
const TIPOS_PIX={celular:'Celular',cpf:'CPF',email:'E-mail',aleatoria:'Chave aleatória'};
const fmtChave=(t,c)=>{c=c||'';if(t==='cpf'&&c.length===11)return c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');if(t==='celular'&&c.length>=10)return c.replace(/(\d{2})(\d{4,5})(\d{4})/,'($1) $2-$3');return c};
const cxv=(id,d)=>S.cx[id]!=null?S.cx[id]:(d==null?'':d);
const numBR=x=>{x=String(x==null?'':x).trim().replace(/[R$\s]/g,'');if(!x)return NaN;if(x.indexOf(',')>=0)x=x.replace(/\./g,'').replace(',','.');return parseFloat(x)};
const vlBR=n=>String((+n||0).toFixed(2)).replace('.',',');
function vCarteira(){
  const C=S.cart;
  if(!C)return`<div class="empty">Carregando…</div>`;
  if(C.erro)return`<section class="box"><span class="eyebrow">Carteira</span><p class="notice warn">Não foi possível carregar a carteira agora. Toque em Atualizar para tentar de novo.</p></section>`;

  const nomePapel=x=>(PAPEIS[x]||x||'').toLowerCase();
  const mov=[

  return`<section class="box"><span class="eyebrow">Regras de venda</span><p class="muted">Pedido do vendedor acima do limite de valor (cartão ou Pix), com parcela abaixo do mínimo ou com mais parcelas que o máximo fica aguardando aprovação. A aprovação é dada pelo gerente da loja, por um supervisor ou pelo proprietário. Gerentes, supervisores e proprietários não têm limite e fazem pedidos com autonomia.</p>${lin('vendedor','Vendedor')}<div class="row"><button class="btn sm pri" data-act="regras-salvar">Salvar regras</button></div></section>`}
async function carregarPerfis(){const{data}=await sb.from('perfis').select('*').order('nome');S.perfis=(data||[]).map(normPerfil)}
async function carregarLojas(){const{data}=await sb.from('lojas').select('*').order('nome');S.lojas=data||[]}
let canal,tRe;
function assinar(){
  if(canal)return;
  canal=sb.channel('pedidos-ao-vivo').on('postgres_changes',{event:'*',schema:'public',table:'pedidos'},()=>{
    clearTimeout(tRe);tRe=setTimeout(async()=>{await carregarPedidos();if(!emEdicao())render()},400)}).subscribe();
}
const emEdicao=()=>['novo','editar','equipe','lojas','cliente'].includes(S.view);
function hist(s){return{s,em:nowIso(),por:S.uid,nome:S.perfil?.nome||''}}

/* ===== render ===== */
function render(){
  const keep={};document.querySelectorAll('[data-dirty]').forEach(el=>{if(el.id)keep[el.id]=el.value});
  const foco=document.activeElement&&document.activeElement.id;
  renderNav();
  const app=$('#app');
  if(S.recuperar)app.innerHTML=vNovaSenha();
  else if(S.conv)app.innerHTML=vConvite();
  else if(S.view==='ajuda')app.innerHTML=vAjuda();
  else if(!S.uid)app.innerHTML=vAuth();
  else if(!S.carregado)app.innerHTML=`<div class="empty">Carregando…</div>`;
  else if(!ativo())app.innerHTML=vPendente();
  else if(papel()==='afiliado'&&!['novo','editar','pedido','carteira'].includes(S.view))app.innerHTML=vAfiliado();
  else if(S.view==='carteira')app.innerHTML=vCarteira();
  else if(S.view==='novo'||S.view==='editar')app.innerHTML=vForm();
  else if(S.view==='pedido')app.innerHTML=vPedido();
  else if(S.view==='equipe'&&(veTodas()||ehGerente()))app.innerHTML=vEquipe();
  else if(S.view==='lojas'&&ehDono())app.innerHTML=vLojas();
  else if(S.view==='afiliados'&&veTodas())app.innerHTML=vAfiliados();
  else if(S.view==='resultados')app.innerHTML=vResultados();
  else if(S.view==='clientes')app.innerHTML=vClientes();
  else if(S.view==='cliente')app.innerHTML=vCliente();
  else{S.view='painel';app.innerHTML=vPainel()}
  Object.entries(keep).forEach(([id,v])=>{const el=document.getElementById(id);if(el){el.value=v;el.dataset.dirty='1'}});
  if(foco){const el=document.getElementById(foco);if(el&&el.focus)el.focus({preventScroll:true})}
  renderBarra();
  if((S.view==='novo'||S.view==='editar')&&S.form&&S.form.vinculo===undefined&&papel()!=='afiliado'){S.form.vinculo=null;checaVinculo()}
}
function renderNav(){
  const v=S.view,cur=k=>v===k?'aria-current="page"':'';
  const sub=$('#sub');
  document.body.classList.toggle('entrada',!S.uid||!!S.conv||S.recuperar);
  if(S.conv){$('#nav').innerHTML='';sub.textContent='Vendas pelo WhatsApp';return}
  if(!S.uid||!ativo()||S.recuperar){$('#nav').innerHTML=S.uid&&!S.recuperar?`<button data-act="sair">Sair</button>`:'';sub.textContent='Vendas pelo WhatsApp';return}
  if(S.perfil.papel==='afiliado'){sub.textContent=`${S.perfil.nome||S.email} · Afiliado`;$('#nav').innerHTML=`<button data-act="ir" data-v="painel" ${S.view!=='carteira'?'aria-current="page"':''}>Vendas</button><button data-act="ir" data-v="carteira" ${S.view==='carteira'?'aria-current="page"':''}>Carteira</button><button class="atualiza" data-act="atualizar" title="Buscar a versão mais recente">↻ Atualizar</button><button data-act="sair">Sair</button><button class="novo" data-act="novo">+ Pedido</button>`;return}
  const l=lojaDe(S.perfil.loja_id);
  sub.textContent=`${S.perfil.nome||S.email} · ${PAPEIS[S.perfil.papel]}${l&&!veTodas()?` · ${l.nome}`:''}`;
  const pend=ehDono()&&S.perfis.some(p=>p.status==='pendente');
  $('#nav').innerHTML=`<button data-act="ir" data-v="painel" ${cur('painel')}>Pedidos</button><button data-act="ir" data-v="clientes" ${cur('clientes')||cur('cliente')}>Clientes</button><button data-act="ir" data-v="resultados" ${cur('resultados')}>Resultados</button><button data-act="ir" data-v="carteira" ${cur('carteira')}>Carteira</button>${veTodas()||ehGerente()?`<button data-act="ir" data-v="equipe" ${cur('equipe')}>Equipe${pend?' •':''}</button>`:''}${veTodas()?`<button data-act="ir" data-v="afiliados" ${cur('afiliados')}>Afiliados</button>`:''}${ehDono()?`<button data-act="ir" data-v="lojas" ${cur('lojas')}>Lojas</button>`:''}<button data-act="ir" data-v="ajuda" ${cur('ajuda')}>Como funciona</button><button class="atualiza" data-act="atualizar" title="Buscar a versão mais recente">↻ Atualizar</button><button data-act="sair">Sair</button>${podeVender()?`<button class="novo" data-act="novo">+ Pedido</button>`:''}`;
}

/* --- acesso --- */

  return`<div class="auth">
    <div><div class="marca">Fech<i>ô</i></div><p class="muted">Vendas das lojas pelo WhatsApp: pedido, pagamento, nota e entrega.</p></div>
    ${m!=='recuperar'?`<div class="seg dois" role="group" aria-label="Acesso"><button data-act="auth-modo" data-m="entrar" aria-pressed="${m==='entrar'}">Entrar</button><button data-act="auth-modo" data-m="criar" aria-pressed="${m==='criar'}">Criar conta</button></div>`:''}
    <form class="box" id="form-auth" novalidate>
      ${m==='criar'?`<div class="f"><label for="a-nome">Nome completo</label><input id="a-nome" autocomplete="name" required></div>`:''}
      <div class="f"><label for="a-email">${m==='entrar'?'E-mail ou WhatsApp':'E-mail'}</label><input id="a-email" ${m==='entrar'?'type="text" autocomplete="username" autocapitalize="none"':'type="email" autocomplete="email"'} required></div>
      ${m!=='recuperar'?`<div class="f"><label for="a-senha">Senha</label><input id="a-senha" type="password" autocomplete="${m==='criar'?'new-password':'current-password'}" minlength="6" required>${m==='criar'?'<small>Mínimo de 6 caracteres.</small>':''}</div>`:''}
      ${m==='criar'?`<div class="f"><label for="a-loja">Loja onde trabalha</label><select id="a-loja"><option value="">Supervisão / escritório</option>${lojasOpt}</select></div>`:''}
      ${a.erro?`<p class="erro" role="alert">${esc(a.erro)}</p>`:''}${a.ok?`<p class="ok-msg">${esc(a.ok)}</p>`:''}
      <button class="btn pri full" type="submit">${m==='entrar'?'Entrar':m==='criar'?'Criar conta':'Enviar link para nova senha'}</button>
      ${m==='entrar'?`<button type="button" class="link" data-act="auth-modo" data-m="recuperar">Esqueci minha senha</button>`:''}
      ${m==='recuperar'?`<button type="button" class="link" data-act="auth-modo" data-m="entrar">Voltar para entrar</button>`:''}
    </form>
    ${m==='criar'?`<p class="notice">Depois de criar a conta, um proprietário libera seu acesso e define seu papel e sua comissão.</p>`:''}
    <button type="button" class="link" data-act="ir" data-v="ajuda">Como funciona o Fechô</button>
  </div>`}
function vNovaSenha(){return`<div class="auth"><div class="marca">Fech<i>ô</i></div><form class="box" id="form-senha"><h2>Defina sua nova senha</h2><div class="f"><label for="n-senha">Nova senha</label><input id="n-senha" type="password" minlength="6" autocomplete="new-password" required></div>${S.auth.erro?`<p class="erro">${esc(S.auth.erro)}</p>`:''}<button class="btn pri full" type="submit">Salvar senha</button></form></div>`}
function vPendente(){
  const p=S.perfil;
  if(!p)return`<div class="empty"><b>Seu cadastro ainda não foi encontrado.</b><span>Saia e entre de novo em alguns instantes.</span></div>`;
  if(p.status==='inativo')return`<div class="empty"><b>Seu acesso está desativado.</b><span>Fale com um proprietário se precisar voltar a usar o Fechô.</span></div>`;
  const l=lojaDe(p.loja_id);
  return`<section class="box"><span class="eyebrow">Cadastro recebido</span><h1>Olá, ${esc(primeiro(p.nome))}</h1><p>Seu acesso${l?` na loja ${esc(nomeLoja(l))}`:''} está aguardando liberação de um proprietário. Quando for liberado, é só abrir o Fechô de novo.</p><button class="btn sm" data-act="recarregar">Verificar de novo</button></section>`}

/* --- painel --- */
function filtrados(){
  const q=S.busca.trim().toLowerCase();
  return S.pedidos.filter(p=>{
    if(S.loja!=='todas'&&p.loja_id!==S.loja)return false;
    if(S.etapa==='ativos'&&(p.status==='entregue'||p.status==='cancelado'))return false;
    if(S.etapa==='meus'&&p.vendedor_id!==S.uid)return false;
    if(S.etapa==='cancelado'&&p.status!=='cancelado')return false;
    if(IDX[S.etapa]!==undefined&&p.status!==S.etapa)return false;
    if(q&&!(`${p.numero} ${p.cliente.nome||''} ${p.cliente.fone||''} ${p.vendedor_nome||''}`.toLowerCase().includes(q)))return false;
    return true})
}
function progHtml(p){const i=p.status==='cancelado'?-1:IDX[p.status];const cls=p.status==='entregue'?'prog done':p.status==='cancelado'?'prog cancel':'prog';return`<div class="${cls}" aria-hidden="true">${ETAPAS.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`}
function vPainel(){
  const base=S.pedidos.filter(p=>S.loja==='todas'||p.loja_id===S.loja);
  const cont=Object.fromEntries(ETAPAS.map(e=>[e[0],0]));base.forEach(p=>{if(cont[p.status]!==undefined)cont[p.status]++});
  const hoje=new Date().toDateString();
  const pagosHoje=base.filter(p=>p.pago_em&&new Date(p.pago_em).toDateString()===hoje&&p.status!=='cancelado');
  const lista=filtrados();const lv=lojasVisiveis();
  return`${blocoCarteiraResumo()}${lv.length>1?`<div class="chips" role="group" aria-label="Loja">
    <button class="chip" data-act="loja" data-id="todas" aria-pressed="${S.loja==='todas'}">Todas as lojas</button>
    ${lv.map(l=>`<button class="chip" data-act="loja" data-id="${esc(l.id)}" aria-pressed="${S.loja===l.id}">${esc(l.nome)}</button>`).join('')}
  </div>`:''}
  <div class="kpi"><span class="muted">Pago hoje <b>${brl(pagosHoje.reduce((s,p)=>s+p.total,0))}</b></span><span class="muted">Pedidos pagos hoje <b>${pagosHoje.length}</b></span></div>
  <div class="pipe" role="group" aria-label="Etapas">
    ${ETAPAS.map(([k,l])=>`<button data-act="etapa" data-id="${k}" aria-pressed="${S.etapa===k}" class="${k==='aguardando'&&cont[k]?'alerta':''}"><b>${cont[k]}</b><span>${l}</span></button>`).join('')}
  </div>
  <div class="chips" role="group" aria-label="Situação">
    <button class="chip" data-act="etapa" data-id="ativos" aria-pressed="${S.etapa==='ativos'}">Em andamento</button>
    ${veTodas()||ehGerente()?`<button class="chip" data-act="etapa" data-id="meus" aria-pressed="${S.etapa==='meus'}">Minhas vendas</button>`:''}
    <button class="chip" data-act="etapa" data-id="todos" aria-pressed="${S.etapa==='todos'}">Todos</button>
    <button class="chip" data-act="etapa" data-id="cancelado" aria-pressed="${S.etapa==='cancelado'}">Cancelados</button>
  </div>
  <input id="busca" class="search" type="search" placeholder="Buscar por cliente, nº do pedido, telefone ou vendedor" value="${esc(S.busca)}" aria-label="Buscar pedidos">
  <div class="list">
    ${lista.length?lista.map(p=>{const l=lojaDe(p.loja_id);const n=p.itens.reduce((s,i)=>s+(i.qtd||0),0);return`
      <button class="card" data-act="abrir" data-id="${esc(p.id)}">
        <div class="card-top"><span class="mono muted">${esc(p.numero)}</span><span><span class="pill st-${esc(p.status)}">${esc(LABEL[p.status]||p.status)}</span>${pendente(p)?' <span class="pill st-pendente">Aprovação</span>':''}</span></div>
        <div class="card-mid"><strong>${esc(p.cliente.nome||'Cliente')}</strong><span class="total">${brl(p.total)}</span></div>
        <div class="card-sub">${esc(l?l.nome:'')} · ${esc(quemVende(p))} · ${n} ${n===1?'peça':'peças'} · ${esc(MODOS[p.modo]||'')} · ${esc(quando(p.atualizado_em||p.criado_em))}${p.itens.some(i=>i.obs)?' · <b class="tem-obs">Com observação</b>':''}</div>
        ${progHtml(p)}
      </button>`}).join(''):`<div class="empty"><span>${S.pedidos.length?'Nenhum pedido neste filtro.':'Nenhum pedido ainda. Monte o primeiro: produtos, frete, forma de pagamento e link, e o Fechô gera a mensagem para o WhatsApp do cliente.'}</span>${podeVender()?'<button class="btn pri" data-act="novo">+ Novo pedido</button>':''}</div>`}
  </div>`;
}

async function salvarPedido(){
  const f=S.form;S.erro='';
  const itens=f.itens.map(i=>({ref:i.ref.trim(),desc:i.desc.trim(),tam:i.tam.trim(),qtd:Math.max(1,parseInt(i.qtd)||1),preco:toNum(i.preco),obs:String(i.obs||'').trim().slice(0,200)})).filter(i=>i.desc||i.ref||i.preco);
  const faltas=[];
  if(!f.lojaId)faltas.push('a loja');
  if(!f.cliente.nome.trim())faltas.push('o nome do cliente');
  if(foneWa(f.cliente.fone).length<12)faltas.push('o WhatsApp do cliente com DDD');
  if(!itens.length||itens.some(i=>!i.desc||!(i.preco>0)))faltas.push('descrição e preço de cada produto');
  if(!f.pag)faltas.push('a forma de pagamento (Pix, cartão à vista ou parcelado)');
  if(f.modo!=='retirada'&&!f.cliente.endereco.trim())faltas.push('o endereço de entrega');
  if(faltas.length){S.erro='Falta preencher '+faltas.join(', ')+'.';render();return}
  const cpf=String(f.cliente.cpf||'').replace(/\D/g,'');if(cpf&&cpf.length!==11){S.erro='O CPF tem 11 dígitos.';render();return}
  let clienteId=f.clienteId;
  try{const cd=dadosCliente({...f.cliente,nascimento:undefined});delete cd.nascimento;delete cd.obs;
    if(clienteId){const r=await sb.from('clientes').update(cd).eq('id',clienteId).select().single();if(r.data){const i=S.clientes.findIndex(x=>x.id===clienteId);if(i>=0)S.clientes[i]=r.data}}
    else{const r=await sb.from('clientes').insert({...cd,loja_id:f.lojaId,vendedor_id:f.vendedorId||null}).select().single();if(r.data){clienteId=r.data.id;S.clientes.push(r.data);S.clientes.sort((a,b)=>a.nome.localeCompare(b.nome))}}
  }catch(e){}
  const dados={loja_id:f.lojaId,vendedor_id:f.vendedorId||null,cliente_id:clienteId||null,cliente:{...f.cliente,nome:f.cliente.nome.trim()},itens,modo:f.modo,frete:f.modo==='retirada'?0:toNum(f.frete),link_pagamento:(papel()==='vendedor'&&violacoes(totaisForm(f).tot,f.pag,papel()).length)?'':f.link.trim(),pagamento:{...pagDeKey(f.pag),gateway:'manual',status:'aguardando'},afiliado_id:f.afiliadoId||null,obs:f.obs.trim()};
  const r=f.id?await gravar(()=>sb.from('pedidos').update(dados).eq('id',f.id).select().single(),'Pedido atualizado')
              :await gravar(()=>sb.from('pedidos').insert({...dados,historico:[hist('aguardando')]}).select().single(),'Pedido gerado');
  if(r){const p=normPed(r);const i=S.pedidos.findIndex(x=>x.id===p.id);if(i>=0)S.pedidos[i]=p;else S.pedidos.unshift(p);S.atual=p.id;S.view='pedido';S.form=null;render();window.scrollTo(0,0)}
}

const keyDePag=g=>{if(!g||!g.forma)return'';if(g.forma==='Pix')return'pix';if(g.forma==='Cartão de débito')return'deb';if(g.forma==='Cartão de crédito')return'cc'+Math.min(6,Math.max(1,+g.parcelas||1));return''};

/* --- resultados e comissões --- */
async function carregarResultados(){
  const [y,m]=S.mes.split('-').map(Number);
  const ini=new Date(y,m-1,1),fim=new Date(y,m,1),ant=new Date(y,m-2,1);
  S.res=null;S.resMes=S.mes;render();
  const cols='id,numero,loja_id,vendedor_id,vendedor_nome,gerente_id,gerentes,comissao_vend,comissao_gerente,subtotal,frete,total,pago_em,criado_em,status,cliente,cliente_id,itens,modo,pagamento';
  const f=d=>d.toISOString();
  const{data,error}=await sb.from('pedidos').select(cols).or(`and(pago_em.gte.${f(ant)},pago_em.lt.${f(fim)}),and(criado_em.gte.${f(ini)},criado_em.lt.${f(fim)})`).order('criado_em',{ascending:false}).limit(5000);
  if(error){toast('Não foi possível carregar os resultados.');S.res=[];S.resPrev=[];S.resCriados=[]}
  else{
    const t=(data||[]).map(normPed),a0=+ant,i0=+ini,f0=+fim;
    const pago=p=>p.pago_em&&p.status!=='cancelado',em=(iso,x,y)=>{const v=+new Date(iso);return v>=x&&v<y};
    S.res=t.filter(p=>pago(p)&&em(p.pago_em,i0,f0));
    S.resPrev=t.filter(p=>pago(p)&&em(p.pago_em,a0,i0));
    S.resCriados=t.filter(p=>em(p.criado_em,i0,f0));
  }
  if(S.view==='resultados')render();
}
function agrupar(ped){
  const lojas={},vends={};
  ped.forEach(p=>{
    const l=lojas[p.loja_id]||(lojas[p.loja_id]={id:p.loja_id,n:0,base:0,comG:0,comV:0,gers:{}});
    l.n++;l.base+=p.subtotal;l.comV+=p.subtotal*p.comissao_vend/100;(p.gerentes||[]).forEach(g=>{const c=p.subtotal*g.pct/100;l.comG+=c;const x=l.gers[g.id]||(l.gers[g.id]={id:g.id,nome:g.nome,com:0});x.com+=c});
    if(p.vendedor_id){const v=vends[p.vendedor_id]||(vends[p.vendedor_id]={id:p.vendedor_id,nome:p.vendedor_nome,loja:p.loja_id,n:0,base:0,com:0});v.n++;v.base+=p.subtotal;v.com+=p.subtotal*p.comissao_vend/100}
  });
  return{lojas:Object.values(lojas).sort((a,b)=>b.base-a.base),vends:Object.values(vends).sort((a,b)=>b.base-a.base)};
}
/* --- indicadores do dashboard --- */
const escopoRes=a=>{
  if(!veTodas()&&!ehGerente())return a.filter(p=>p.vendedor_id===S.uid);
  const lj=ehGerente()?S.perfil.loja_id:S.resLoja;return lj?a.filter(p=>p.loja_id===lj):a};
const soma=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const pecas=a=>soma(a,p=>soma(p.itens,i=>+i.qtd||0));
const varPct=(a,b)=>b>0?(a-b)/b*100:null;
const badgeVar=v=>v==null?'':typeof v==='string'?`<span class="var neutra">${esc(v)}</span>`:`<span class="var ${v>=0?'up':'down'}">${v>=0?'▲':'▼'} ${Math.abs(v).toFixed(1).replace('.',',')}%</span>`;
function tilesV(arr){return`<div class="tiles">${arr.map(([rot,val,gold,v])=>`<div class="tile${gold?' gold':''}"><span class="muted">${rot}</span><b>${val}</b>${badgeVar(v)}</div>`).join('')}</div>`}
function periodoAnt(){const hoje=new Date().getDate(),atual=S.mes===mesAtual();return S.resPrev.filter(p=>!atual||new Date(p.pago_em).getDate()<=hoje)}
function ctxRes(){
  const P=escopoRes(S.res),PP=escopoRes(periodoAnt()),C=escopoRes(S.resCriados);
  const v=soma(P,p=>p.subtotal),vp=soma(PP,p=>p.subtotal),tk=P.length?v/P.length:0,tkp=PP.length?vp/PP.length:0,pc=pecas(P),pcp=pecas(PP);
  return{P,PP,C,v,tk,pc,dV:varPct(v,vp),dN:varPct(P.length,PP.length),dT:varPct(tk,tkp),dP:varPct(pc,pcp)};
}
function fmtDur(min){if(!isFinite(min)||min<0)return'—';if(min<1)return'< 1 min';if(min<60)return`${Math.round(min)} min`;if(min<1440){const h=Math.floor(min/60),m=Math.round(min%60);return m?`${h} h ${m} min`:`${h} h`}return`${(min/1440).toFixed(1).replace('.',',')} dias`}
function graficoDias(P){
  const[y,m]=S.mes.split('-').map(Number),n=new Date(y,m,0).getDate();
  const v=Array(n).fill(0);P.forEach(p=>{v[new Date(p.pago_em).getDate()-1]+=p.subtotal});

  const rot=v.map((x,i)=>(i===0||(i+1)%5===0)?`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H+16}" text-anchor="middle">${i+1}</text>`:'').join('');
  return`<section class="box"><span class="eyebrow">Vendas por dia</span><svg class="grafico" viewBox="0 0 ${W} ${H+22}" role="img" aria-label="Vendas em produtos por dia do mês">${barras}${rot}</svg>${dias?`<p class="muted" style="font-size:13.5px">Melhor dia: <b>${topo+1}</b>, com ${brl(v[topo])} · ${dias} ${dias===1?'dia':'dias'} com venda · média de ${brl(soma(P,p=>p.subtotal)/dias)} por dia vendido</p>`:'<p class="muted">Nenhuma venda paga neste mês.</p>'}</section>`;
}
function blocoFunil(C,P){
  const criados=C.length,canc=C.filter(p=>p.status==='cancelado').length,aguard=C.filter(p=>p.status==='aguardando'),pagos=criados-canc-aguard.length;
  const conv=criados?pagos/criados*100:0;
  const tempos=P.filter(p=>p.criado_em&&p.pago_em).map(p=>(new Date(p.pago_em)-new Date(p.criado_em))/60000);
  const medio=tempos.length?tempos.reduce((a,b)=>a+b,0)/tempos.length:NaN;
  return`<section class="box"><span class="eyebrow">Conversão dos pedidos</span>
    <div class="conv"><b>${conv.toFixed(0)}%</b><span class="muted">dos pedidos criados no mês já foram pagos</span></div>
    <dl class="dl"><dt>Pedidos criados</dt><dd>${criados}</dd><dt>Pagos</dt><dd>${pagos}</dd><dt>Aguardando</dt><dd>${aguard.length} · ${brl(soma(aguard,p=>p.subtotal))}</dd><dt>Cancelados</dt><dd>${canc}</dd><dt>Tempo até pagar</dt><dd>${fmtDur(medio)} em média</dd></dl></section>`;

function distrib(titulo,pares,manter){
  const tot=soma(pares,x=>x[1]);if(!tot)return'';
  return`<section class="box"><span class="eyebrow">${titulo}</span><ul class="dist">${(manter?pares:[...pares].sort((a,b)=>b[1]-a[1])).map(([r,v,sub])=>`<li><span class="d-top"><b>${esc(r)}</b><span>${(v/tot*100).toFixed(0)}%${sub?' · '+esc(sub):''}</span></span><span class="rk-bar"><i style="width:${(v/tot*100).toFixed(1)}%"></i></span></li>`).join('')}</ul></section>`;
}
function agrup(P,chave,valor){const m={};P.forEach(p=>{const k=chave(p);m[k]=(m[k]||0)+valor(p)});return Object.entries(m)}
function topProdutos(P){

  return ranking('Produtos mais vendidos',l.map(x=>({id:'',nome:x.desc,valor:x.v,sub:`${x.ref?'Ref. '+esc(x.ref)+' · ':''}${x.q} ${x.q===1?'peça':'peças'}`})));

function blocoPagamento(P){
  if(!P.length)return'';
  const F=p=>(p.pagamento&&p.pagamento.forma)||'Não informada',tot=soma(P,p=>p.total)||1;
  const por=n=>{const l=P.filter(p=>F(p)===n);return{n:l.length,v:soma(l,p=>p.total)}};
  const pix=por('Pix'),cr=por('Cartão de crédito'),db=por('Cartão de débito');
  const pc=x=>`${(x.v/tot*100).toFixed(0)}%`;
  const C=P.filter(ehCredito),inf=C.filter(p=>parcelasDe(p)>0),parc=inf.filter(p=>parcelasDe(p)>1);
  const media=inf.length?soma(inf,p=>parcelasDe(p))/inf.length:0;
  const pcParc=C.length?parc.length/C.length*100:0;
  const cont={};C.forEach(p=>{const n=parcelasDe(p);const k=n?(n===1?'À vista':n+'x'):'Não informado';cont[k]=(cont[k]||0)+1});
  const ordem=k=>k==='À vista'?1:k==='Não informado'?99:parseInt(k);
  const parcelas=Object.entries(cont).sort((a,b)=>ordem(a[0])-ordem(b[0])).map(([k,n])=>[k,n,`${n} ${n===1?'pedido':'pedidos'}`]);
  return tilesV([['Pix',pc(pix),0,`${pix.n} ${pix.n===1?'pedido':'pedidos'} · ${brl(pix.v)}`],['Cartão de crédito',pc(cr),0,`${cr.n} ${cr.n===1?'pedido':'pedidos'} · ${brl(cr.v)}`],['Cartão de débito',pc(db),0,`${db.n} ${db.n===1?'pedido':'pedidos'} · ${brl(db.v)}`],['Parcelamento médio',inf.length?`${media.toFixed(1).replace('.',',')}x`:'—',0,C.length?`${pcParc.toFixed(0)}% do crédito parcelado`:'sem vendas no crédito']])
   +(C.length?`<div class="dash2e">${distrib('Parcelas no cartão de crédito',parcelas,true)}</div>`:'');
}
function dashboard(X){
  const{P,C}=X,mes0=new Date(S.mes+'-01T00:00:00'),mes1=new Date(mes0.getFullYear(),mes0.getMonth()+1,1);
  const clientes=new Set(P.map(p=>p.cliente_id||foneWa(p.cliente.fone)||p.cliente.nome)).size;

  return tilesV([['Peças vendidas',X.pc,0,X.dP],['Clientes atendidos',clientes],['Novos cadastros',novos],['Aguardando pagamento agora',brl(soma(aberto,p=>p.subtotal)),0]])
   +`<p class="muted" style="font-size:13px">${recompra?`${recompra} ${recompra===1?'cliente comprou':'clientes compraram'} mais de uma vez no mês. `:''}As setas comparam com o mesmo período do mês anterior.</p>`
   +`<div class="dash2">${graficoDias(P)}${blocoFunil(C,P)}</div>`
   +blocoPagamento(P)
   +`<div class="dash3">${distrib('Tipo de entrega',agrup(P,p=>MODOS[p.modo]||p.modo||'—',p=>1))}${distrib('Tamanhos mais vendidos',Object.entries(itensTam).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>[k,v,`${v} ${v===1?'peça':'peças'}`]))}</div>`
   +topProdutos(P);
}

const nomeLj=id=>(lojaDe(id)||{}).nome||'Loja';
const nomeGer=id=>id===S.uid?'você':((perfilDe(id)||{}).nome||'gerente');
function tiles(arr){return`<div class="tiles">${arr.map(([rot,val,gold])=>`<div class="tile${gold?' gold':''}"><span class="muted">${rot}</span><b>${val}</b></div>`).join('')}</div>`}
function ranking(titulo,linhas,acao){

  const r=c.id?await gravar(()=>sb.from('clientes').update(d).eq('id',c.id).select().single(),'Cadastro salvo')
              :await gravar(()=>sb.from('clientes').insert({...d,loja_id:c.loja_id,vendedor_id:c.vendedor_id}).select().single(),'Cliente cadastrado');
  if(r){const i=S.clientes.findIndex(x=>x.id===r.id);if(i>=0)S.clientes[i]=r;else S.clientes.push(r);S.clientes.sort((a,b)=>a.nome.localeCompare(b.nome));S.cli={...r,nascimento:r.nascimento||''};render()}

/* CEP: preenche endereço pelo ViaCEP */
async function buscaCep(cep,alvo){
  const d=String(cep).replace(/\D/g,'');if(d.length!==8)return;
  try{const r=await fetch(`https://viacep.com.br/ws/${d}/json/`);const j=await r.json();if(j.erro)return;
    const set=(k,v)=>{if(!v)return;if(alvo==='form'){if(!S.form.cliente[k]){S.form.cliente[k]=v;const el=$('#f-'+({endereco:'end',bairro:'bairro',cidade:'cidade'}[k]));if(el)el.value=v}}else if(S.cli&&!S.cli[k]){S.cli[k]=v;const el=$('#c-'+k);if(el)el.value=v}};
    if(alvo==='form'&&S.form){const ant=S.form.cliente.cidade;if(ant==='Rio de Janeiro'&&j.localidade&&j.localidade!==ant){S.form.cliente.cidade='';}}
    if(alvo==='cli'&&S.cli&&S.cli.cidade==='Rio de Janeiro'&&j.localidade!=='Rio de Janeiro')S.cli.cidade='';
    set('endereco',j.logradouro?j.logradouro+', ':'');set('bairro',j.bairro);set('cidade',j.localidade);
    const el=alvo==='form'?$('#f-end'):$('#c-endereco');if(el&&j.logradouro){el.focus();el.setSelectionRange(el.value.length,el.value.length)}
  }catch(e){}
}

document.addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(ev.target.id==='form-senha'){const s=$('#n-senha').value;if(s.length<6){S.auth.erro='A senha precisa ter pelo menos 6 caracteres.';render();return}
    const{error}=await sb.auth.updateUser({password:s});if(error){S.auth.erro='Não foi possível salvar a senha. Peça um novo link.';render();return}
    S.recuperar=false;S.auth.erro='';history.replaceState(null,'',location.pathname);toast('Senha alterada');render();return}
  if(ev.target.id==='form-conv'){
    const c=S.conv;c.erro='';
    const v={nome:($('#v-nome')?.value||'').trim(),cpf:$('#v-cpf')?.value||'',nascimento:$('#v-nasc')?.value||'',email:($('#v-email')?.value||'').trim()};c.v=v;
    const senha=$('#v-senha').value;
    if(senha.length<6){c.erro='A senha precisa ter no mínimo 6 caracteres.';render();return}
    if(c.info.tipo!=='reset'&&!v.nome){c.erro='Informe seu nome.';render();return}
    const btn=ev.target.querySelector('[type=submit]');btn.disabled=true;
    const r=await chamaConvite({acao:'aceitar',token:c.token,senha,...v});
    if(!r.ok){c.erro=r.erro;render();return}
    S.conv=null;history.replaceState(null,'',location.pathname);
    const{error}=await sb.auth.signInWithPassword({email:r.email,password:senha});
    if(error){S.auth={modo:'entrar',erro:'',ok:'Cadastro concluído. Entre com seu WhatsApp e a senha.'};render()}
    else toast('Bem-vindo ao Fechô');
    return;
  }
  if(ev.target.id!=='form-auth')return;
  const a=S.auth;a.erro='';a.ok='';
  let email=$('#a-email').value.trim();
  if(!email){a.erro=a.modo==='entrar'?'Informe o e-mail ou o WhatsApp.':'Informe o e-mail.';render();return}
  const porFone=!email.includes('@');
  if(porFone){
    const d=foneWa(email);
    if(a.modo!=='entrar'){a.erro='Informe um e-mail válido.';render();return}
    if(d.length<12||d.length>13){a.erro='Informe o WhatsApp com DDD, ou o e-mail.';render();return}
    email=emailDoFone(d);
  }
  const btn=ev.target.querySelector('[type=submit]');btn.disabled=true;
  try{
    if(a.modo==='entrar'){
      const{error}=await sb.auth.signInWithPassword({email,password:$('#a-senha').value});
      if(error)a.erro=error.message.includes('confirm')?'Confirme seu e-mail pelo link que enviamos antes de entrar.':'E-mail, WhatsApp ou senha incorretos.';
    }else if(a.modo==='criar'){
      const nome=$('#a-nome').value.trim(),senha=$('#a-senha').value,loja=$('#a-loja').value;
      if(!nome){a.erro='Informe seu nome.'}else if(senha.length<6){a.erro='A senha precisa ter pelo menos 6 caracteres.'}
      else{const{data,error}=await sb.auth.signUp({email,password:senha,options:{data:{nome,loja_id:loja},emailRedirectTo:location.origin}});
        if(error)a.erro=error.message.includes('registered')?'Este e-mail já tem conta. Use Entrar.':'Não foi possível criar a conta: '+error.message;
        else if(!data.session){a.ok='Conta criada. Abra o e-mail que enviamos e confirme o endereço para entrar.';a.modo='entrar'}}
    }else{
      const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
      if(error)a.erro='Não foi possível enviar o link. Tente de novo em alguns minutos.';else a.ok='Se o e-mail tiver conta, o link para nova senha chega em instantes.';
    }
  }finally{btn.disabled=false}
  render();
});

  /* ---------- gatilho do pedido (igual ao do banco) ---------- */
  function preparaPedido(n,o,op){
    const a=euP(),edit=op==='insert'||(o.status==='aguardando'&&n.status==='aguardando');
    if(a.papel==='afiliado'&&op==='update'&&!edit)falha('O afiliado só pode alterar o pedido enquanto ele aguarda o pagamento.');
    if(!edit)['itens','frete','modo','loja_id','vendedor_id','vendedor_nome','gerente_id','gerentes','supervisores','comissao_vend','comissao_gerente','numero','criado_em','criado_por','afiliado_id','afiliado_nome','comissao_afiliado','afiliado_origem'].forEach(k=>n[k]=o[k]);
    if(op==='update'){n.entregue_em=o.entregue_em;n.afiliado_pago_em=o.afiliado_pago_em;n.afiliado_pago_por=o.afiliado_pago_por}else{n.entregue_em=null;n.afiliado_pago_em=null;n.afiliado_pago_por=null}
    n.itens=n.itens||[];
    const s=n.itens.reduce((t,i)=>t+Math.max(+i.qtd||0,0)*Math.max(+i.preco||0,0),0);
    if(n.modo==='retirada')n.frete=0;
    n.subtotal=r2(s);n.total=r2(n.subtotal+(+n.frete||0));n.atualizado_em=agora();
    const loja=db.lojas.find(l=>l.id===n.loja_id)||{};
    if(edit){
      const v=perfil(n.vendedor_id)||{};
      const gs=db.perfis.filter(g=>g.loja_id===n.loja_id&&g.papel==='gerente'&&g.status==='ativo').map(g=>({id:g.id,nome:g.nome,pct:+g.comissao||0}));
      n.vendedor_nome=v.nome||'';n.comissao_vend=v.papel==='vendedor'?(+v.comissao||0):0;
      n.gerentes=gs;n.gerente_id=gs[0]?gs[0].id:null;n.comissao_gerente=gs.reduce((t,g)=>t+g.pct,0);
      n.supervisores=db.perfis.filter(p=>p.papel==='supervisor'&&p.status==='ativo').map(p=>({id:p.id,nome:p.nome,pct:p.comissao==null?1:+p.comissao}));
      const f=fk(n.cliente&&n.cliente.fone);let af=null;
      if(a.papel==='afiliado'){
        n.vendedor_id=null;n.vendedor_nome='';n.afiliado_id=a.id;
        if(op==='update'&&o.afiliado_id===a.id){n.afiliado_nome=o.afiliado_nome;n.comissao_afiliado=o.comissao_afiliado;n.afiliado_origem=o.afiliado_origem}
        else{n.afiliado_nome=a.nome;n.comissao_afiliado=a.comissao_direta==null?6:+a.comissao_direta;n.afiliado_origem='direta'}
      }else if(op==='update'&&(n.afiliado_id||null)===(o.afiliado_id||null)){n.afiliado_nome=o.afiliado_nome;n.comissao_afiliado=o.comissao_afiliado;n.afiliado_origem=o.afiliado_origem}
      else{
        if(n.afiliado_id&&['gerente','supervisor','proprietario'].includes(a.papel))af=db.perfis.find(p=>p.id===n.afiliado_id&&p.papel==='afiliado'&&p.status==='ativo');
        else if(op==='insert'&&f){const vin=db.vinculos.find(x=>x.fone===f&&x.ate>agora());if(vin)af=db.perfis.find(p=>p.id===vin.afiliado_id&&p.status==='ativo')}
        if(!af){n.afiliado_id=null;n.afiliado_nome='';n.comissao_afiliado=0;n.afiliado_origem=null}
        else{n.afiliado_id=af.id;n.afiliado_nome=af.nome;n.comissao_afiliado=af.comissao==null?4:+af.comissao;n.afiliado_origem='indicacao'}
      }
      if(n.afiliado_id&&f&&(op==='insert'||o.afiliado_id!==n.afiliado_id)){
        const ate=new Date(Date.now()+90*864e5).toISOString(),x=db.vinculos.find(v=>v.fone===f);
        if(!x)db.vinculos.push({fone:f,afiliado_id:n.afiliado_id,ate});else if(x.ate<=agora()||x.afiliado_id===n.afiliado_id){x.afiliado_id=n.afiliado_id;x.ate=ate}
      }
      if(n.afiliado_id)n.comissao_vend=0;
    }
    let ap=op==='update'?(o.aprovacao||{}):{};
    if(n.__aprovando){ap=n.aprovacao}
    else if(edit){
      const pg=n.pagamento||{},parc=pg.forma==='Cartão de crédito'?(+pg.parcelas||1):1,viol=[];
      if(a.papel==='vendedor'){
        const r=db.regras.find(x=>x.papel==='vendedor');
        if(r){const lim=pg.forma==='Pix'?r.limite_pix:r.limite_valor;
          if(lim!=null&&n.total>lim)viol.push({tipo:'valor',meio:pg.forma==='Pix'?'Pix':'cartão',limite:lim,atual:n.total});
          if(parc>1&&r.parcela_min!=null&&n.total/parc<r.parcela_min)viol.push({tipo:'parcela_min',limite:r.parcela_min,atual:r2(n.total/parc)});

      }
      if(op==='update'&&o.aprovacao&&o.aprovacao.status==='aprovada'&&+o.aprovacao.total===n.total&&(+o.aprovacao.parcelas||1)===parc)ap=o.aprovacao;
      else if(viol.length)ap={status:'pendente',exige:a.papel==='vendedor'?'gerente':'supervisor',motivos:viol};
      else ap={};
    }

    if(op==='insert'){

    }else if(!['aguardando','cancelado'].includes(n.status)&&!n.pago_em)n.pago_em=agora();
    if(op==='update'&&n.status==='entregue'&&o.status!=='entregue')n.entregue_em=agora();
    return n;
  }
  function criaPedido(d){const n={id:nid('p'),historico:[],nf:{},entrega:{},link_pagamento:'',obs:'',...d};preparaPedido(n,null,'insert');db.pedidos.push(n);return n}

  function visivel(t,r){

    if(t==='pedidos'){if(a.papel==='gerente')return r.loja_id===a.loja_id;if(a.papel==='vendedor')return r.vendedor_id===a.id;return r.afiliado_id===a.id&&r.criado_por===a.id}
    if(t==='clientes'){if(a.papel==='gerente')return r.loja_id===a.loja_id;if(a.papel==='vendedor')return r.vendedor_id===a.id;return false}
    if(t==='perfis'){if(a.papel==='gerente')return r.loja_id===a.loja_id||r.id===a.id;return r.id===a.id}
    if(t==='convites'){return a.papel==='gerente'&&r.papel==='vendedor'&&r.loja_id===a.loja_id}
    return true;
  }

  /* ---------- carteira ---------- */
  const cfg=k=>(db.config.find(c=>c.chave===k)||{valor:{}}).valor;
  function comissoesDe(id){
    const prazo=+cfg('afiliado').prazo_dias||7,ini=cfg('carteira').inicio||'1970',L=[];
    db.pedidos.forEach(p=>{
      if(['aguardando','cancelado'].includes(p.status))return;
      if(p.status==='entregue'&&!(p.entregue_em&&p.entregue_em>=ini))return;
      const add=(papel,valor)=>{if(!(valor>0))return;const lib=p.status==='entregue'&&!!p.entregue_em&&new Date(p.entregue_em).getTime()+prazo*864e5<=Date.now();
        L.push({pedido_id:p.id,numero:p.numero,papel,valor:r2(valor),liberada:lib,libera_em:p.entregue_em?new Date(new Date(p.entregue_em).getTime()+prazo*864e5).toISOString():null,status:p.status,criado_em:p.criado_em})};
      if(p.vendedor_id===id&&!p.afiliado_id)add('vendedor',p.subtotal*p.comissao_vend/100);
      (p.gerentes||[]).forEach(g=>{if(g.id===id)add('gerente',p.subtotal*g.pct/100)});
      (p.supervisores||[]).forEach(g=>{if(g.id===id)add('supervisor',p.subtotal*g.pct/100)});
      if(p.afiliado_id===id&&!p.afiliado_pago_em)add('afiliado',p.subtotal*p.comissao_afiliado/100);
    });
    return L.sort((a,b)=>b.criado_em.localeCompare(a.criado_em));
  }
  function carteira(id){
    if(id!==eu&&!veTodas())falha('Sem permissão.');
    const C=comissoesDe(id),sq=db.saques.filter(s=>s.perfil_id===id),aj=db.ajustes.filter(a=>a.perfil_id===id);
    const lib=C.filter(c=>c.liberada).reduce((t,c)=>t+c.valor,0),apos=C.filter(c=>!c.liberada).reduce((t,c)=>t+c.valor,0);
    const sol=sq.filter(s=>s.status==='solicitado').reduce((t,s)=>t+s.valor,0),pago=sq.filter(s=>s.status==='pago').reduce((t,s)=>t+s.valor,0),ajs=aj.reduce((t,a)=>t+a.valor,0);
    const k=db.pix[id];
    return{prazo_dias:+cfg('afiliado').prazo_dias||7,saque_min:+cfg('carteira').saque_min||10,disponivel:r2(lib+ajs-sol-pago),a_liberar:r2(apos),em_saque:r2(sol),sacado:r2(pago),ajustes:r2(ajs),chave:k||null,
      comissoes:C.slice(0,100),saques:sq.slice().sort((a,b)=>b.criado_em.localeCompare(a.criado_em)),ajustes_lista:aj.slice().reverse()};
  }

  /* ---------- funções do banco (rpc) ---------- */
  const R={
    minha_carteira:a=>carteira((a&&a.p_perfil)||eu),
    carteiras_resumo:()=>{if(!veTodas())falha('Sem permissão.');
      const pessoas=[];db.perfis.filter(p=>p.status==='ativo').forEach(p=>{const c=carteira(p.id);if(c.disponivel||c.a_liberar||c.em_saque||c.sacado)pessoas.push({id:p.id,nome:p.nome,papel:p.papel,loja_id:p.loja_id,disponivel:c.disponivel,a_liberar:c.a_liberar,em_saque:c.em_saque,sacado:c.sacado})});
      const saques=db.saques.slice().sort((a,b)=>(b.status==='solicitado')-(a.status==='solicitado')||b.criado_em.localeCompare(a.criado_em)).slice(0,60).map(s=>({...s,nome:(perfil(s.perfil_id)||{}).nome,papel:(perfil(s.perfil_id)||{}).papel}));
      return{pessoas,saques}},
    salvar_chave_pix:a=>{let c=String(a.p_chave||'').trim();const d=c.replace(/\D/g,''),t=a.p_tipo;
      if(t==='cpf'){if(d.length!==11)falha('CPF deve ter 11 números.');c=d}else if(t==='celular'){if(![10,11].includes(d.length))falha('Celular deve ter DDD + número.');c=d}
      else if(t==='email'){c=c.toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c))falha('E-mail inválido.')}
      else if(t==='aleatoria'){c=c.toLowerCase();if(!/^[0-9a-f-]{32,36}$/.test(c))falha('Chave aleatória inválida.')}else falha('Tipo de chave inválido.');
      db.pix[eu]={tipo:t,chave:c};return{tipo:t,chave:c}},
    solicitar_saque:a=>{const k=db.pix[eu];if(!k)falha('Cadastre sua chave Pix antes de sacar.');const c=carteira(eu),v=r2(+a.p_valor||0);
      if(v<c.saque_min)falha('O saque mínimo é R$ '+String(c.saque_min.toFixed(2)).replace('.',',')+'.');if(v>c.disponivel)falha('Valor maior que o saldo disponível.');
      const s={id:nid('s'),perfil_id:eu,valor:v,chave_tipo:k.tipo,chave:k.chave,status:'solicitado',criado_em:agora(),resolvido_em:null,resolvido_por:null,obs:''};db.saques.push(s);return s},
    resolver_saque:a=>{if(euP().papel!=='proprietario')falha('Apenas o proprietário confirma saques.');if(!['pago','recusado'].includes(a.p_acao))falha('Ação inválida.');
      if(a.p_acao==='recusado'&&!String(a.p_obs||'').trim())falha('Informe o motivo da recusa.');
      const s=db.saques.find(x=>x.id===a.p_id&&x.status==='solicitado');if(!s)falha('Saque não encontrado ou já resolvido.');
      s.status=a.p_acao;s.resolvido_em=agora();s.resolvido_por=eu;s.obs=String(a.p_obs||'').trim();return s},
    lancar_ajuste:a=>{if(euP().papel!=='proprietario')falha('Apenas o proprietário lança ajustes.');if(!perfil(a.p_perfil))falha('Pessoa não encontrada.');
      const x={id:nid('a'),perfil_id:a.p_perfil,valor:r2(+a.p_valor),motivo:String(a.p_motivo||'').trim(),criado_em:agora(),criado_por:eu};db.ajustes.push(x);return x},
    lista_afiliados:()=>['proprietario','supervisor','gerente'].includes(euP().papel)?db.perfis.filter(p=>p.papel==='afiliado'&&p.status==='ativo').map(p=>({id:p.id,nome:p.nome,comissao:p.comissao,codigo:p.codigo_afiliado})):[],
    minhas_vendas_afiliado:()=>{const me=euP(),prazo=+cfg('afiliado').prazo_dias||7;if(me.papel!=='afiliado')return{prazo_dias:prazo,pedidos:[]};
      return{prazo_dias:prazo,codigo:me.codigo_afiliado,pct_indicacao:me.comissao==null?4:+me.comissao,pct_direta:me.comissao_direta==null?6:+me.comissao_direta,
        pedidos:db.pedidos.filter(p=>p.afiliado_id===me.id).sort((a,b)=>b.criado_em.localeCompare(a.criado_em)).map(p=>({id:p.id,numero:p.numero,criado_em:p.criado_em,status:p.status,subtotal:p.subtotal,pct:p.comissao_afiliado,comissao:r2(p.subtotal*p.comissao_afiliado/100),origem:p.afiliado_origem,entregue_em:p.entregue_em,pago_em:p.afiliado_pago_em,meu:p.criado_por===me.id,cliente:String((p.cliente||{}).nome||'').split(' ')[0]}))}},
    meu_link_afiliado:()=>euP().papel!=='afiliado'?[]:db.perfis.filter(g=>g.papel==='gerente'&&g.status==='ativo'&&g.fone).map(g=>({loja:(db.lojas.find(l=>l.id===g.loja_id)||{}).nome,gerente:g.nome,fone:g.fone})),
    afiliado_do_cliente:a=>{if(!['proprietario','supervisor','gerente','vendedor'].includes(euP().papel))return null;const v=db.vinculos.find(x=>x.fone===fk(a.p_fone)&&x.ate>agora());const p=v&&perfil(v.afiliado_id);return p?{id:p.id,nome:p.nome,ate:v.ate}:null},
    definir_comissao_afiliado:a=>{if(!veTodas())falha('Sem permissão.');const p=perfil(a.p_id);if(p){p.comissao=+a.p_indicacao;p.comissao_direta=+a.p_direta}return null},
    pagar_comissoes_afiliado:a=>{if(!veTodas())falha('Sem permissão.');const prazo=+cfg('afiliado').prazo_dias||7;let n=0,tot=0;
      db.pedidos.forEach(p=>{if(p.afiliado_id===a.p_afiliado&&p.status==='entregue'&&!p.afiliado_pago_em&&p.entregue_em&&new Date(p.entregue_em).getTime()+prazo*864e5<=Date.now()){p.afiliado_pago_em=agora();p.afiliado_pago_por=eu;n++;tot+=p.subtotal*p.comissao_afiliado/100}});return{qtd:n,total:r2(tot)}},
    aprovar_pedido:a=>{const p=db.pedidos.find(x=>x.id===a.p_id);if(!p)falha('Pedido não encontrado.');if((p.aprovacao||{}).status!=='pendente')falha('Este pedido não está aguardando aprovação.');
      const me=euP(),ok=['proprietario','supervisor'].includes(me.papel)||(p.aprovacao.exige==='gerente'&&me.papel==='gerente'&&me.loja_id===p.loja_id);
      if(!ok)falha('Você não pode aprovar este pedido.');if(me.id===p.criado_por&&me.papel!=='proprietario')falha('Quem criou o pedido não pode aprová-lo.');
      const pg=p.pagamento||{},parc=pg.forma==='Cartão de crédito'?(+pg.parcelas||1):1;
      p.aprovacao={status:'aprovada',por:me.id,por_nome:me.nome,em:agora(),total:p.total,parcelas:parc,motivos:p.aprovacao.motivos};return p.aprovacao},
    criar_convite:a=>{const c={id:nid('cv'),nome:a.p_nome,fone:String(a.p_fone||'').replace(/\D/g,''),papel:a.p_papel,loja_id:a.p_loja||null,comissao:a.p_comissao,status:'pendente',tipo:'novo',criado_em:agora(),expira_em:dias(-30)};db.convites.push(c);return c},
    editar_convite:a=>{const c=db.convites.find(x=>x.id===a.p_id);if(!c)falha('Convite não encontrado.');Object.assign(c,{nome:a.p_nome,fone:String(a.p_fone||'').replace(/\D/g,''),papel:a.p_papel,loja_id:a.p_loja||null,comissao:a.p_comissao});return c},
    cancelar_convite:a=>{db.convites=db.convites.filter(x=>x.id!==a.p_id);return null},
    link_nova_senha:()=>{falha('Não disponível na demonstração.')}
  };

  /* ---------- consulta (mesmo jeito do cliente real) ---------- */
  function tabela(t){return db[t]}
  function Q(t){
    const st={op:'select',f:[],ord:null,lim:null,corpo:null,um:null};
    const q={
      select(){return q},insert(o){st.op='insert';st.corpo=o;return q},update(o){st.op='update';st.corpo=o;return q},
      eq(c,v){st.f.push(r=>r[c]===v);return q},
      or(expr){const g=[...String(expr).matchAll(/and\(([^)]*)\)/g)].map(m=>m[1].split(',').map(x=>{const [c,op,...v]=x.split('.');return r=>{const a=r[c];if(a==null)return false;const b=v.join('.');return op==='gte'?a>=b:op==='lt'?a<b:true}}));st.f.push(r=>g.some(cs=>cs.every(f=>f(r))));return q},
      order(c,o){st.ord=[c,!(o&&o.ascending===false)];return q},limit(n){st.lim=n;return q},
      maybeSingle(){st.um='maybe';return q},single(){st.um='one';return q},
      then(res,rej){let out;try{out=exec()}catch(e){out={data:null,error:{message:e.message,code:e.code||'P0001'}}}return Promise.resolve(out).then(res,rej)}
    };
    function exec(){
      const T=tabela(t);if(!T)return{data:[],error:null};
      const casa=r=>st.f.every(f=>f(r));
      let rows;
      if(st.op==='select'){rows=T.filter(r=>visivel(t,r)&&casa(r))}
      else if(st.op==='insert'){
        const c=st.corpo;let novo;
        if(t==='pedidos')novo=criaPedido({...c,id:nid('p')});
        else{novo={id:nid(t[0]),criado_em:agora(),...c};T.push(novo)}
        rows=[novo];
      }else{
        rows=T.filter(r=>visivel(t,r)&&casa(r));
        rows.forEach(r=>{
          if(t==='pedidos'){const n={...r,...st.corpo},c=JSON.parse(JSON.stringify(r));const res=preparaPedido(n,c,'update');Object.assign(r,res)}
          else if(t==='config'){r.valor=st.corpo.valor;r.atualizado_em=agora()}
          else Object.assign(r,st.corpo);
        });
      }
      if(st.ord){const [c,asc]=st.ord;rows=rows.slice().sort((a,b)=>{const x=a[c],y=b[c];return(x==null?-1:y==null?1:x<y?-1:x>y?1:0)*(asc?1:-1)})}
      if(st.lim)rows=rows.slice(0,st.lim);
      rows=JSON.parse(JSON.stringify(rows));
      if(st.op!=='select')salva();
      if(st.um==='one'){if(rows.length!==1)return{data:null,error:{message:'Registro não encontrado.',code:'PGRST116'}};return{data:rows[0],error:null}}
      if(st.um==='maybe')return{data:rows[0]||null,error:null};
      return{data:rows,error:null};
    }
    return q;
  }

  /* ---------- sessão e barra de papéis ---------- */
  let cb=null;
  const sessao=id=>({user:{id,email:perfil(id).email}});
  function troca(id){eu=id;if(cb)cb('SIGNED_IN',sessao(id));pinta()}
  function pinta(){document.querySelectorAll('#demo-bar [data-id]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===eu?'true':'false'))}
  function barra(){
    if(document.getElementById('demo-bar'))return;
    const st=document.createElement('style');
    st.textContent='#demo-bar{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#111;color:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:12px system-ui,sans-serif;border-top:2px solid #e5484d}#demo-bar b{color:#ffb4b6;margin-right:4px}#demo-bar button{font:600 12px system-ui,sans-serif;background:#2a2a2a;color:#fff;border:1px solid #555;border-radius:14px;padding:6px 10px;cursor:pointer}#demo-bar button[aria-pressed=true]{background:#e5484d;border-color:#e5484d}body{padding-bottom:92px}';
    document.head.appendChild(st);
    const d=document.createElement('div');d.id='demo-bar';
    d.innerHTML='<b>DEMONSTRAÇÃO · dados de mentira</b>'+PERS.map(p=>'<button data-id="'+p[1]+'">'+p[2]+'</button>').join('')+'<button data-zera="1">Zerar</button>';
    d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.zera){try{sessionStorage.removeItem(KEY)}catch(x){}location.reload()}else troca(b.dataset.id)});
    document.body.appendChild(d);pinta();
  }
  if(!db||!db.perfis)semear();

  return{
    from:Q,rpc:(n,a)=>{let out;try{if(!R[n])throw new Error('Função indisponível na demonstração.');out={data:JSON.parse(JSON.stringify(R[n](a||{})??null)),error:null};salva()}catch(e){out={data:null,error:{message:e.message,code:e.code||'P0001'}}}return Promise.resolve(out)},
    channel(){const c={on(){return c},subscribe(){return c}};return c},removeChannel(){},
    auth:{
      onAuthStateChange(f){cb=f;setTimeout(()=>{f('INITIAL_SESSION',sessao(eu));barra()},0);return{data:{subscription:{unsubscribe(){}}}}},
      signInWithPassword:async({email})=>{const p=db.perfis.find(x=>x.email===email);if(!p)return{data:null,error:{message:'Na demonstração, use os botões de papel na barra de baixo.'}};troca(p.id);return{data:{},error:null}},
      signUp:async()=>({data:null,error:{message:'Cadastro não disponível na demonstração.'}}),
      signOut:async()=>{troca('u-dono');return{error:null}},
      updateUser:async()=>({data:{},error:null}),resetPasswordForEmail:async()=>({data:{},error:null})
    }
  };
}

sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY'){S.recuperar=true;S.auth.erro=''}
  const novo=session?.user?.id||null;
  if(novo!==S.uid){
    S.uid=novo;S.email=session?.user?.email||'';
    S.perfil=null;S.cart=null;S.cartEq=null;S.cx={};S.pedidos=[];S.perfis=[];S.view='painel';S.loja='todas';S.etapa='ativos';S.form=null;S.res=null;S.resMes=null;S.resLoja=null;S.clientes=[];S.cli=null;
    if(canal){sb.removeChannel(canal);canal=null}
    if(novo)setTimeout(carregarTudo,0);else{S.carregado=false;setTimeout(async()=>{await carregarLojas();render()},0)}
  }
  render();
});

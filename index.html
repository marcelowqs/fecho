<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fechô</title>
<meta name="theme-color" content="#15171a">
<meta name="versao" content="2026-10-28.5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fechô">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2323262a'/%3E%3Ctext x='32' y='45' font-family='Arial' font-weight='700' font-size='38' text-anchor='middle' fill='%23d6b25a'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de balcão mobile-first; faixa grafite no topo, coluna única de até 760px, ações em dourado */
:root{
  --bg:#f2f0eb; --surface:#ffffff; --surface-2:#ebe8e1; --line:#d8d3c8; --fg:#23262a; --muted:#686b70;
  --gold:#8f6c17; --gold-soft:#f2e8cc; --on-gold:#ffffff;
  --head-bg:#23262a; --head-fg:#efece5; --head-muted:#a7a9ad; --head-gold:#d6b25a;
  --ok:#2b7546; --ok-soft:#dbeee1; --warn:#9c5a0c; --warn-soft:#f7e6cd; --bad:#a33131; --bad-soft:#f5dada; --info:#2b5a86; --info-soft:#dce7f2;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#16181b; --surface:#202327; --surface-2:#292d32; --line:#363a41; --fg:#ebe8e1; --muted:#9a9ea5;
  --gold:#d6b25a; --gold-soft:#3a3220; --on-gold:#1a1b1d;
  --head-bg:#0e0f11; --head-fg:#ebe8e1; --head-muted:#8d9096; --head-gold:#d6b25a;
  --ok:#6cbf8a; --ok-soft:#1e3326; --warn:#e2a457; --warn-soft:#3a2b17; --bad:#e97c7c; --bad-soft:#3c2121; --info:#80b1de; --info-soft:#1c2b3a;
  color-scheme:dark }}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.02em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head-bg);color:var(--head-fg)}
.top-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:140px;flex:1}
.brand b{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.01em}
.brand b i{font-style:normal;color:var(--head-gold)}
.brand span{font-size:12px;color:var(--head-muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.nav button{flex:none;background:transparent;border:1px solid transparent;color:var(--head-muted);padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px}
.nav button[aria-current="page"]{color:var(--head-fg);border-color:#ffffff26}
.nav .novo{background:var(--head-gold);color:#1a1b1d;font-weight:600}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
p{margin:0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg);min-height:42px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.wa{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.full{width:100%}
.link{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;font-weight:600;text-decoration:underline}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-aguardando,.st-pendente{background:var(--warn-soft);color:var(--warn)}
.st-pago,.st-embalado,.st-coletado{background:var(--info-soft);color:var(--info)}
.st-faturado{background:var(--gold-soft);color:var(--gold)}
.st-entregue,.st-ativo{background:var(--ok-soft);color:var(--ok)}
.st-cancelado,.st-inativo{background:var(--bad-soft);color:var(--bad)}

.pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:620px){.pipe{grid-template-columns:repeat(6,1fr)}}
.pipe button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.pipe button b{font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.pipe button span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pipe button.alerta b{color:var(--warn)}
.kpi{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.kpi b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.tile.gold b{color:var(--gold)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}

.list{display:flex;flex-direction:column;gap:8px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;width:100%}
.card:hover{border-color:var(--gold)}
.card-top,.card-mid{display:flex;justify-content:space-between;gap:10px;align-items:center;min-width:0}
.card-mid strong{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card-mid .total{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;flex:none}
.card-sub{font-size:13px;color:var(--muted)}
.prog{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.prog i{height:4px;border-radius:2px;background:var(--surface-2)}
.prog i.on{background:var(--gold)}
.prog.done i.on{background:var(--ok)}
.prog.cancel i{background:var(--bad-soft)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box.destaque{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.notice{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;font-size:13.5px;color:var(--muted)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.grid3 .f:first-child{grid-column:1/-1}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:42px}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold);outline:none}
.f small{color:var(--muted);font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:9px;padding:4px}
.seg.dois{grid-template-columns:1fr 1fr}
.seg button{border:0;background:transparent;border-radius:7px;padding:8px 6px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px #0000001f}
.item{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.item-h{display:flex;justify-content:space-between;align-items:center}
.erro{color:var(--bad);font-size:14px;font-weight:500}
.ok-msg{color:var(--ok);font-size:14px;font-weight:500}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.barra-in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.barra-in .tot{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.barra-in .tot b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}

.itens{width:100%;border-collapse:collapse;font-size:14px}
.itens td{padding:6px 0;border-bottom:1px solid var(--surface-2);vertical-align:top}
.itens td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.totais{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.totais .g{font-family:var(--f-display);font-size:20px;font-weight:700}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:12px;font-size:14px;max-height:340px;overflow:auto;width:100%;min-height:120px;resize:vertical}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:12px 1fr;gap:10px;padding-bottom:10px;position:relative}
.hist li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:5px}
.hist li:not(:last-child)::after{content:"";position:absolute;left:4.5px;top:16px;bottom:0;width:1px;background:var(--line)}
.hist small{color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
a{color:var(--gold)}
.tabw{overflow-x:auto}
.tab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tab th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tab td{padding:8px;border-bottom:1px solid var(--surface-2);white-space:nowrap}
.tab .r{text-align:right}
.tab tfoot td{font-weight:700;border-bottom:0}
.check{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 6px;color:var(--fg)}
button.rk{cursor:pointer}
button.rk:hover{background:var(--surface-2)}
.pos{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
li:first-child .pos{color:var(--gold)}
.rk-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.rk-top{display:flex;justify-content:space-between;gap:10px;min-width:0}
.rk-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-val{font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.rk-bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.rk small{color:var(--muted);font-size:12.5px}
.rk-go{color:var(--muted);font-size:22px;line-height:1}
.sug{display:flex;flex-direction:column;gap:4px}
.sug:empty{display:none}
.passos{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.passos li::marker{font-family:var(--f-display);font-weight:700;color:var(--gold)}
.passos p{color:var(--muted);font-size:14px;margin-top:2px}
.papeis{margin:0;display:flex;flex-direction:column;gap:10px}
.papeis div{padding:8px 10px;border-radius:8px}
.papeis div.eu{background:var(--gold-soft)}
.papeis dt{font-weight:600}
.papeis dd{margin:2px 0 0;color:var(--muted);font-size:14px}
.sug-i{display:flex;justify-content:space-between;gap:10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.sug-i:hover{border-color:var(--gold)}
.sug-i span{color:var(--muted);font-size:13px;white-space:nowrap}

.auth{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.auth .marca{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1}
.auth .marca i{font-style:normal;color:var(--gold)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.confirma{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:10px 12px}

/* ===== Visual comercial: cabeçalho escuro com filete dourado, tipografia forte, cartões elevados ===== */
:root{--r:14px;--sombra:0 1px 2px #0000000f,0 10px 28px #0000000f;--sombra-alta:0 2px 4px #00000014,0 16px 36px #0000001f;
  --gold-grad:linear-gradient(135deg,#e2c06a 0%,#c99a2e 55%,#a87b16 100%);--ouro:#c99a2e}
@media (prefers-color-scheme: dark){:root{--sombra:0 1px 2px #0000004d,0 10px 28px #00000059;--sombra-alta:0 2px 4px #00000066,0 16px 36px #00000073}}
body{background:radial-gradient(1200px 400px at 50% -80px,color-mix(in srgb,var(--ouro) 10%,transparent),transparent 70%) no-repeat,var(--bg);font-size:15.5px}
.top{background:linear-gradient(180deg,#1b1d21 0%,#121316 100%);border-bottom:3px solid var(--ouro);box-shadow:0 6px 22px #00000040}
.top-in{max-width:1040px;padding-block:12px}
.brand b{font-size:34px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b i{color:var(--ouro)}
.brand span{font-size:11.5px;letter-spacing:.14em;color:#b9bbc0}
.nav{gap:6px}
.nav button{border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;letter-spacing:.01em;color:#c4c6ca;transition:background .15s,color .15s}
.nav button:hover{background:#ffffff14;color:#fff}
.nav button[aria-current="page"]{background:#ffffff1f;color:#fff;border-color:transparent;box-shadow:inset 0 -2px 0 var(--ouro)}
.nav .novo{background:var(--gold-grad);color:#17181a;font-weight:700;box-shadow:0 4px 14px #c99a2e66;text-transform:uppercase;letter-spacing:.04em}
.nav .novo:hover{background:var(--gold-grad);color:#17181a;filter:brightness(1.06)}
.nav .atualiza{color:var(--ouro)}
.wrap{max-width:1040px;padding-top:26px;gap:20px}
h1{font-size:34px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
h1::after{content:"";display:block;width:54px;height:4px;background:var(--gold-grad);border-radius:2px;margin-top:8px}
h2{font-size:22px;letter-spacing:.02em}
.eyebrow{color:var(--gold);letter-spacing:.14em;font-size:11.5px}
.btn{border-radius:11px;min-height:46px;padding:11px 20px;font-weight:700;letter-spacing:.01em;box-shadow:0 1px 2px #0000000d;transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #00000026}
.btn.pri{background:var(--gold-grad);border-color:#a87b16;color:#17181a;text-transform:uppercase;letter-spacing:.05em;font-size:14px;box-shadow:0 6px 18px #c99a2e59}
.btn.wa{box-shadow:0 6px 16px #2b754640}
.btn.sm{min-height:36px;padding:7px 13px;font-size:13.5px;border-radius:9px}
.btn.pri.sm{letter-spacing:.04em;font-size:12.5px}
.box{border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);padding:20px;box-shadow:var(--sombra);gap:14px}
.box.destaque{box-shadow:var(--sombra),inset 4px 0 0 var(--ouro)}
.tiles{grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.tile{border:0;border-top:4px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sombra);gap:6px}
.tile.gold{border-top-color:var(--ouro);background:linear-gradient(180deg,color-mix(in srgb,var(--ouro) 14%,var(--surface)),var(--surface))}
.tile b{font-size:clamp(24px,2.5vw,32px);line-height:1.05;letter-spacing:.01em;white-space:nowrap}
.tile .muted{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.pipe{gap:10px}
.pipe button{border-radius:var(--r);padding:14px 14px;box-shadow:var(--sombra);border-color:transparent}
.pipe button b{font-size:32px}
.pipe button span{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.pipe button[aria-pressed="true"]{border-color:var(--ouro);box-shadow:var(--sombra),inset 0 0 0 2px var(--ouro)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.card{border-radius:var(--r);padding:16px 18px;box-shadow:var(--sombra);border-color:transparent;gap:8px;transition:transform .14s,box-shadow .14s}
button.card:hover,a.card:hover{transform:translateY(-2px);box-shadow:var(--sombra-alta);border-color:var(--ouro)}
.card-mid strong{font-size:17px}
.card-mid .total{font-size:22px;color:var(--gold)}
.pill{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px}
.chip{border-radius:999px;padding:8px 16px;font-weight:600;box-shadow:var(--sombra);border-color:transparent}
.chip[aria-pressed="true"]{background:#17181a;color:var(--ouro);box-shadow:inset 0 -3px 0 var(--ouro)}
.search,.f input,.f select,.f textarea{border-radius:11px;border-width:1.5px;min-height:46px;background:var(--surface)}
.f input:focus,.f select:focus,.f textarea:focus,.search:focus{border-color:var(--ouro);box-shadow:0 0 0 4px color-mix(in srgb,var(--ouro) 22%,transparent)}
.f label{text-transform:uppercase;letter-spacing:.07em;font-size:11.5px}
.seg{border-radius:12px;padding:5px}
.seg button{padding:10px 8px;border-radius:9px;font-size:14px}
.seg button[aria-pressed="true"]{box-shadow:var(--sombra)}
.notice{border-left:4px solid var(--ouro);border-radius:10px}
.rk-bar{height:8px}.rk-bar i{background:var(--gold-grad)}
.rk{padding:10px 8px}.pos{font-size:22px}.rk-val{font-size:18px}
.barra{background:linear-gradient(180deg,#1b1d21,#121316);border-top:3px solid var(--ouro);color:#efece5}
.barra-in{max-width:1040px}
.barra-in .tot b{font-size:26px;color:var(--ouro)}
.empty{border-radius:var(--r);background:var(--surface);box-shadow:var(--sombra);border:0;padding:40px 22px}
.tab th{text-transform:uppercase;letter-spacing:.08em}
.toast{background:#17181a;color:#fff;border-left:4px solid var(--ouro);box-shadow:var(--sombra-alta)}

/* tela de entrada: bloco de marca escuro e imponente */
.auth{max-width:480px;margin-top:4vh;gap:20px}
.auth>div:first-child{background:linear-gradient(150deg,#1d2024 0%,#0f1012 100%);color:#efece5;border-radius:20px;padding:34px 28px 30px;box-shadow:var(--sombra-alta);border-bottom:5px solid var(--ouro);position:relative;overflow:hidden}
.auth>div:first-child::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#c99a2e55,transparent 70%)}
.auth .marca{font-size:76px;text-transform:uppercase;letter-spacing:.02em;line-height:.95}
.auth .marca i{color:var(--ouro)}
.auth>div:first-child .muted{color:#b9bbc0;margin-top:12px;font-size:15px;position:relative}
.auth .box{padding:24px}

.var{font-size:12.5px;font-weight:700}.var.up{color:var(--ok)}.var.down{color:var(--bad)}
.grafico{width:100%;height:auto}.grafico .bar{fill:color-mix(in srgb,var(--ouro) 50%,var(--surface-2))}.grafico .bar.top{fill:var(--ouro)}.grafico .bar.hoje{stroke:var(--fg);stroke-width:1.2}
.grafico text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.conv{display:flex;align-items:baseline;gap:12px}.conv b{font-family:var(--f-display);font-size:54px;line-height:1;color:var(--gold)}
.dist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}.dist li{display:flex;flex-direction:column;gap:6px}
.d-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}.d-top span{color:var(--muted);white-space:nowrap}
.dash2{display:grid;grid-template-columns:2fr 1fr;gap:20px}.dash3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
@media (max-width:760px){.dash2{grid-template-columns:1fr}}
body.entrada .top-in{display:none}
body.entrada .top{background:transparent;border-bottom:0;box-shadow:none}
body.entrada .top:has(.upd[hidden]){display:none}
/* aviso de nova versão */
.upd{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;background:var(--gold-grad);color:#17181a;padding:9px 16px;font-weight:700;font-size:14px}
.upd .btn{background:#17181a;color:var(--ouro);border-color:#17181a;min-height:34px;padding:5px 14px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;box-shadow:none}
@media (max-width:560px){h1{font-size:28px}.auth .marca{font-size:60px}.brand b{font-size:28px}}

<body>
<header class="top">
  <div id="upd" class="upd" role="status" hidden><span>Há uma nova versão do Fechô disponível.</span><button class="btn sm" data-act="atualizar">Atualizar agora</button></div>
  <div class="top-in">
    <div class="brand"><b>Fech<i>ô</i></b><span id="sub">Vendas pelo WhatsApp</span></div>
    <nav class="nav" id="nav"></nav>
  </div>
</header>
<main id="app" class="wrap" aria-live="polite"><div class="empty">Carregando…</div></main>
<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Configuração ===== */
const SUPABASE_URL='https://ucuvtorgapdvawitwzfc.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjdXZ0b3JnYXBkdmF3aXR3emZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMjgxMTgsImV4cCI6MjEwODgwNDExOH0.9H_1BVTehBYKEZnlkf2J_aUbqx35nPY7JPJkraqZfKo';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const ETAPAS=[['aguardando','Aguardando pagamento'],['pago','Pago'],['embalado','Embalado'],['faturado','NF emitida'],['coletado','Em entrega'],['entregue','Entregue']];
const IDX=Object.fromEntries(ETAPAS.map((e,i)=>[e[0],i]));
const LABEL={...Object.fromEntries(ETAPAS),cancelado:'Cancelado'};
const MODOS={motoboy:'Motoboy por app',transportadora:'Correios / transportadora',retirada:'Retirada na loja'};
const APPS=['Lalamove','Uber Direct','99Entrega','Loggi','Correios','Transportadora','Outro'];
const TAMS=['PP','P','M','G','GG','XG','XGG','2','4','6','8','10','12','14','16','36','38','40','42','44','Único'];
const PAPEIS={proprietario:'Proprietário',supervisor:'Supervisor',gerente:'Gerente',vendedor:'Vendedor'};
const STATUS_P={pendente:'Aguardando liberação',ativo:'Ativo',inativo:'Inativo'};

const mesAtual=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
/* versão publicada: o app confere sozinho se há uma nova e avisa no topo */
const VERSAO=(document.querySelector('meta[name=versao]')||{}).content||'';
async function checaVersao(){
  if(!VERSAO)return;
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const t=await r.text(),m=t.match(/<meta name="versao" content="([^"]+)"/);
    const el=document.getElementById('upd');
    if(m&&m[1]!==VERSAO&&el)el.hidden=false;
  }catch(e){}
}
const S={uid:null,email:'',perfil:null,lojas:[],perfis:[],pedidos:[],carregado:false,recuperar:false,
  view:'painel',loja:'todas',etapa:'ativos',busca:'',atual:null,form:null,erro:'',confirmaCancel:false,busy:false,
  auth:{modo:'entrar',erro:'',ok:''},mes:mesAtual(),res:null,resMes:null,resLoja:null,eq:{},lj:{},conv:null,convites:[],cv:null,reset:{},clientes:[],cli:null,cliBusca:'',cliBuscaForm:''};

/* ===== utilidades ===== */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const toNum=v=>{if(typeof v==='number')return v;const s=String(v||'').trim().replace(/[^\d,.-]/g,'');if(!s)return 0;const n=s.includes(',')?parseFloat(s.replace(/\./g,'').replace(',','.')):parseFloat(s);return isFinite(n)?n:0};
const precoTxt=n=>n?Number(n).toFixed(2).replace('.',','):'';
const pct=n=>`${String(+n||0).replace('.',',')}%`;
const nowIso=()=>new Date().toISOString();
const foneWa=t=>{let d=String(t||'').replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;return d};
const foneFmt=t=>{const d=String(t||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'');if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return t||''};
const primeiro=n=>String(n||'').trim().split(/\s+/)[0]||'';
const quando=iso=>{if(!iso)return'';const d=new Date(iso),m=(Date.now()-d)/60000;if(m<1)return'agora';if(m<60)return`há ${Math.floor(m)} min`;const hm=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(new Date().toDateString()===d.toDateString())return`hoje, ${hm}`;return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+', '+hm};
const lojaDe=id=>S.lojas.find(l=>l.id===id);
const nomeLoja=l=>l?`${l.marca||''} ${l.nome||''}`.trim():'Loja';
const pedido=id=>S.pedidos.find(p=>p.id===id);
const perfilDe=id=>S.perfis.find(p=>p.id===id)||(S.perfil&&S.perfil.id===id?S.perfil:null);
const normPed=p=>({...p,subtotal:+p.subtotal||0,frete:+p.frete||0,total:+p.total||0,comissao_vend:+p.comissao_vend||0,comissao_gerente:+p.comissao_gerente||0,gerentes:p.gerentes||[],historico:p.historico||[],cliente:p.cliente||{},itens:p.itens||[],nf:p.nf||{},entrega:p.entrega||{},pagamento:p.pagamento||{}});
const normPerfil=p=>p&&({...p,comissao:p.comissao==null?null:+p.comissao});

/* papéis */
const ativo=()=>!!S.perfil&&S.perfil.status==='ativo';
const papel=()=>ativo()?S.perfil.papel:null;
const ehDono=()=>papel()==='proprietario';
const veTodas=()=>papel()==='proprietario'||papel()==='supervisor';
const ehGerente=()=>papel()==='gerente';
const podeVender=()=>veTodas()||(ativo()&&!!S.perfil.loja_id);
const lojasVisiveis=()=>veTodas()?S.lojas.filter(l=>l.ativa!==false):S.lojas.filter(l=>l.id===S.perfil?.loja_id);
const veComissao=p=>veTodas()||p.vendedor_id===S.uid||(p.gerentes||[]).some(g=>g.id===S.uid);

let tt;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2800)}
function erroTxt(e){const c=e&&e.code;if(c==='42501')return'Sem permissão para esta ação.';if(c==='23514')return'Valor fora do permitido. Comissão: vendedor de 2% a 5%, gerente de 1% a 2%.';if(c==='P0001'&&e.message)return e.message;if(c==='23505')return'Já existe um registro igual (sigla repetida ou outro gerente ativo nesta loja).';return'Não foi possível salvar. Verifique a conexão e tente de novo.'}
async function gravar(fn,okMsg){
  if(S.busy)return null;S.busy=true;
  try{const r=await fn();if(r.error){toast(erroTxt(r.error));return null}if(okMsg)toast(okMsg);return r.data??true}
  catch(e){toast('Sem conexão. Tente de novo.');return null}
  finally{S.busy=false}
}

/* ===== mensagens ao cliente ===== */
function linhasItens(p){return(p.itens||[]).map(i=>`• ${i.qtd}x ${i.desc}${i.ref?` (Ref. ${i.ref})`:''}${i.tam?` – Tam. ${i.tam}`:''} – ${brl(i.preco*i.qtd)}`).join('\n')}
function enderecoTxt(c){return[c.endereco,c.bairro,c.cidade].filter(Boolean).join(', ')+(c.cep?` – CEP ${c.cep}`:'')}
function msgResumo(p){
  const l=lojaDe(p.loja_id),c=p.cliente;
  const frete=p.modo==='retirada'?`Retirada na loja ${l?l.nome:''}: sem frete`:`Frete (${p.modo==='motoboy'?'entrega por motoboy':'envio'}): ${brl(p.frete)}`;
  let t=`Olá, ${primeiro(c.nome)}! Aqui é ${p.vendedor_nome||'a equipe'}, da loja ${nomeLoja(l)}.\n\nResumo do seu pedido nº ${p.numero}:\n${linhasItens(p)}\n\nSubtotal: ${brl(p.subtotal)}\n${frete}\n*Total: ${brl(p.total)}*`;
  if(p.modo!=='retirada'&&enderecoTxt(c))t+=`\n\nEntrega em: ${enderecoTxt(c)}`;
  t+=p.link_pagamento?`\n\nPague com cartão ou Pix por este link seguro:\n${p.link_pagamento}\n\nAssim que o pagamento for confirmado, separamos seu pedido e enviamos a nota fiscal.`:`\n\nEm seguida envio o link para pagamento com cartão ou Pix.`;
  return t}
function msgAtual(p){
  const c=p.cliente,l=lojaDe(p.loja_id),nf=p.nf,e=p.entrega;
  switch(p.status){
    case'aguardando':return msgResumo(p);
    case'pago':case'embalado':return`${primeiro(c.nome)}, pagamento do pedido nº ${p.numero} confirmado! Já estamos separando seus produtos. Assim que a nota fiscal for emitida, envio aqui.`;
    case'faturado':{let t=`Seu pedido nº ${p.numero} foi faturado.\nNota fiscal nº ${nf.numero||''}`;if(nf.chave)t+=`\nChave de acesso: ${nf.chave}`;if(nf.link)t+=`\nBaixe a nota: ${nf.link}`;t+=p.modo==='retirada'?`\n\nJá pode retirar na loja ${nomeLoja(l)}.`:`\n\nAvisarei assim que sair para entrega.`;return t}
    case'coletado':{let t=`Seu pedido nº ${p.numero} saiu para entrega${e.app?` via ${e.app}`:''}.`;if(e.link)t+=`\nAcompanhe a entrega: ${e.link}`;else if(e.codigo)t+=`\nCódigo de rastreio: ${e.codigo}`;return t}
    case'entregue':return`Pedido nº ${p.numero} entregue. Obrigado pela compra, ${primeiro(c.nome)}! Qualquer dúvida, é só chamar aqui.`;
    default:return`Olá, ${primeiro(c.nome)}. O pedido nº ${p.numero} foi cancelado. Qualquer dúvida, estou à disposição.`}
}

/* ===== dados ===== */
async function carregarTudo(){
  S.carregado=false;render();
  const [pf,lj]=await Promise.all([sb.from('perfis').select('*').eq('id',S.uid).maybeSingle(),sb.from('lojas').select('*').order('nome')]);
  S.perfil=normPerfil(pf.data);S.lojas=lj.data||[];
  if(ativo()){
    await Promise.all([carregarPedidos(),carregarClientes(),veTodas()||ehGerente()?carregarPerfis():null]);
    if(!veTodas()&&S.perfil.loja_id)S.loja=S.perfil.loja_id;
    assinar();
  }
  S.carregado=true;render();
}
async function carregarPedidos(){const{data,error}=await sb.from('pedidos').select('*').order('criado_em',{ascending:false}).limit(500);if(error){toast('Não foi possível carregar os pedidos.');return}S.pedidos=(data||[]).map(normPed)}
async function carregarPerfis(){const{data}=await sb.from('perfis').select('*').order('nome');S.perfis=(data||[]).map(normPerfil)}
async function carregarLojas(){const{data}=await sb.from('lojas').select('*').order('nome');S.lojas=data||[]}
let canal,tRe;
function assinar(){
  if(canal)return;
  canal=sb.channel('pedidos-ao-vivo').on('postgres_changes',{event:'*',schema:'public',table:'pedidos'},()=>{
    clearTimeout(tRe);tRe=setTimeout(async()=>{await carregarPedidos();if(!emEdicao())render()},400)}).subscribe();
}
const emEdicao=()=>['novo','editar','equipe','lojas','cliente'].includes(S.view);
function hist(s){return{s,em:nowIso(),por:S.uid,nome:S.perfil?.nome||''}}

/* ===== render ===== */
function render(){
  const keep={};document.querySelectorAll('[data-dirty]').forEach(el=>{if(el.id)keep[el.id]=el.value});
  const foco=document.activeElement&&document.activeElement.id;
  renderNav();
  const app=$('#app');
  if(S.recuperar)app.innerHTML=vNovaSenha();
  else if(S.conv)app.innerHTML=vConvite();
  else if(S.view==='ajuda')app.innerHTML=vAjuda();
  else if(!S.uid)app.innerHTML=vAuth();
  else if(!S.carregado)app.innerHTML=`<div class="empty">Carregando…</div>`;
  else if(!ativo())app.innerHTML=vPendente();
  else if(S.view==='novo'||S.view==='editar')app.innerHTML=vForm();
  else if(S.view==='pedido')app.innerHTML=vPedido();
  else if(S.view==='equipe'&&(veTodas()||ehGerente()))app.innerHTML=vEquipe();
  else if(S.view==='lojas'&&ehDono())app.innerHTML=vLojas();
  else if(S.view==='resultados')app.innerHTML=vResultados();
  else if(S.view==='clientes')app.innerHTML=vClientes();
  else if(S.view==='cliente')app.innerHTML=vCliente();
  else{S.view='painel';app.innerHTML=vPainel()}
  Object.entries(keep).forEach(([id,v])=>{const el=document.getElementById(id);if(el){el.value=v;el.dataset.dirty='1'}});
  if(foco){const el=document.getElementById(foco);if(el&&el.focus)el.focus({preventScroll:true})}
  renderBarra();
}
function renderNav(){
  const v=S.view,cur=k=>v===k?'aria-current="page"':'';
  const sub=$('#sub');
  document.body.classList.toggle('entrada',!S.uid||!!S.conv||S.recuperar);
  if(S.conv){$('#nav').innerHTML='';sub.textContent='Vendas pelo WhatsApp';return}
  if(!S.uid||!ativo()||S.recuperar){$('#nav').innerHTML=S.uid&&!S.recuperar?`<button data-act="sair">Sair</button>`:'';sub.textContent='Vendas pelo WhatsApp';return}
  const l=lojaDe(S.perfil.loja_id);
  sub.textContent=`${S.perfil.nome||S.email} · ${PAPEIS[S.perfil.papel]}${l&&!veTodas()?` · ${l.nome}`:''}`;
  const pend=ehDono()&&S.perfis.some(p=>p.status==='pendente');
  $('#nav').innerHTML=`<button data-act="ir" data-v="painel" ${cur('painel')}>Pedidos</button><button data-act="ir" data-v="clientes" ${cur('clientes')||cur('cliente')}>Clientes</button><button data-act="ir" data-v="resultados" ${cur('resultados')}>Resultados</button>${veTodas()||ehGerente()?`<button data-act="ir" data-v="equipe" ${cur('equipe')}>Equipe${pend?' •':''}</button>`:''}${ehDono()?`<button data-act="ir" data-v="lojas" ${cur('lojas')}>Lojas</button>`:''}<button data-act="ir" data-v="ajuda" ${cur('ajuda')}>Como funciona</button><button class="atualiza" data-act="atualizar" title="Buscar a versão mais recente">↻ Atualizar</button><button data-act="sair">Sair</button>${podeVender()?`<button class="novo" data-act="novo">+ Pedido</button>`:''}`;
}

/* --- acesso --- */
function vAuth(){
  const a=S.auth,m=a.modo;
  const lojasOpt=S.lojas.filter(l=>l.ativa!==false).map(l=>`<option value="${esc(l.id)}">${esc(nomeLoja(l))}</option>`).join('');
  return`<div class="auth">
    <div><div class="marca">Fech<i>ô</i></div><p class="muted">Vendas das lojas pelo WhatsApp: pedido, pagamento, nota e entrega.</p></div>
    ${m!=='recuperar'?`<div class="seg dois" role="group" aria-label="Acesso"><button data-act="auth-modo" data-m="entrar" aria-pressed="${m==='entrar'}">Entrar</button><button data-act="auth-modo" data-m="criar" aria-pressed="${m==='criar'}">Criar conta</button></div>`:''}
    <form class="box" id="form-auth" novalidate>
      ${m==='criar'?`<div class="f"><label for="a-nome">Nome completo</label><input id="a-nome" autocomplete="name" required></div>`:''}
      <div class="f"><label for="a-email">${m==='entrar'?'E-mail ou WhatsApp':'E-mail'}</label><input id="a-email" ${m==='entrar'?'type="text" autocomplete="username" autocapitalize="none"':'type="email" autocomplete="email"'} required></div>
      ${m!=='recuperar'?`<div class="f"><label for="a-senha">Senha</label><input id="a-senha" type="password" autocomplete="${m==='criar'?'new-password':'current-password'}" minlength="6" required>${m==='criar'?'<small>Mínimo de 6 caracteres.</small>':''}</div>`:''}
      ${m==='criar'?`<div class="f"><label for="a-loja">Loja onde trabalha</label><select id="a-loja"><option value="">Supervisão / escritório</option>${lojasOpt}</select></div>`:''}
      ${a.erro?`<p class="erro" role="alert">${esc(a.erro)}</p>`:''}${a.ok?`<p class="ok-msg">${esc(a.ok)}</p>`:''}
      <button class="btn pri full" type="submit">${m==='entrar'?'Entrar':m==='criar'?'Criar conta':'Enviar link para nova senha'}</button>
      ${m==='entrar'?`<button type="button" class="link" data-act="auth-modo" data-m="recuperar">Esqueci minha senha</button>`:''}
      ${m==='recuperar'?`<button type="button" class="link" data-act="auth-modo" data-m="entrar">Voltar para entrar</button>`:''}
    </form>
    ${m==='criar'?`<p class="notice">Depois de criar a conta, um proprietário libera seu acesso e define seu papel e sua comissão.</p>`:''}
    <button type="button" class="link" data-act="ir" data-v="ajuda">Como funciona o Fechô</button>
  </div>`}
function vNovaSenha(){return`<div class="auth"><div class="marca">Fech<i>ô</i></div><form class="box" id="form-senha"><h2>Defina sua nova senha</h2><div class="f"><label for="n-senha">Nova senha</label><input id="n-senha" type="password" minlength="6" autocomplete="new-password" required></div>${S.auth.erro?`<p class="erro">${esc(S.auth.erro)}</p>`:''}<button class="btn pri full" type="submit">Salvar senha</button></form></div>`}
function vPendente(){
  const p=S.perfil;
  if(!p)return`<div class="empty"><b>Seu cadastro ainda não foi encontrado.</b><span>Saia e entre de novo em alguns instantes.</span></div>`;

/* --- painel --- */
function filtrados(){
  const q=S.busca.trim().toLowerCase();
  return S.pedidos.filter(p=>{
    if(S.loja!=='todas'&&p.loja_id!==S.loja)return false;
    if(S.etapa==='ativos'&&(p.status==='entregue'||p.status==='cancelado'))return false;
    if(S.etapa==='meus'&&p.vendedor_id!==S.uid)return false;
    if(S.etapa==='cancelado'&&p.status!=='cancelado')return false;
    if(IDX[S.etapa]!==undefined&&p.status!==S.etapa)return false;
    if(q&&!(`${p.numero} ${p.cliente.nome||''} ${p.cliente.fone||''} ${p.vendedor_nome||''}`.toLowerCase().includes(q)))return false;
    return true})
}

async function salvarPedido(){
  const f=S.form;S.erro='';
  const itens=f.itens.map(i=>({ref:i.ref.trim(),desc:i.desc.trim(),tam:i.tam.trim(),qtd:Math.max(1,parseInt(i.qtd)||1),preco:toNum(i.preco)})).filter(i=>i.desc||i.ref||i.preco);
  const faltas=[];
  if(!f.lojaId)faltas.push('a loja');
  if(!f.cliente.nome.trim())faltas.push('o nome do cliente');
  if(foneWa(f.cliente.fone).length<12)faltas.push('o WhatsApp do cliente com DDD');
  if(!itens.length||itens.some(i=>!i.desc||!(i.preco>0)))faltas.push('descrição e preço de cada produto');
  if(f.modo!=='retirada'&&!f.cliente.endereco.trim())faltas.push('o endereço de entrega');
  if(faltas.length){S.erro='Falta preencher '+faltas.join(', ')+'.';render();return}
  const cpf=String(f.cliente.cpf||'').replace(/\D/g,'');if(cpf&&cpf.length!==11){S.erro='O CPF tem 11 dígitos.';render();return}
  let clienteId=f.clienteId;
  try{const cd=dadosCliente({...f.cliente,nascimento:undefined});delete cd.nascimento;delete cd.obs;
    if(clienteId){const r=await sb.from('clientes').update(cd).eq('id',clienteId).select().single();if(r.data){const i=S.clientes.findIndex(x=>x.id===clienteId);if(i>=0)S.clientes[i]=r.data}}
    else{const r=await sb.from('clientes').insert({...cd,loja_id:f.lojaId,vendedor_id:f.vendedorId||null}).select().single();if(r.data){clienteId=r.data.id;S.clientes.push(r.data);S.clientes.sort((a,b)=>a.nome.localeCompare(b.nome))}}
  }catch(e){}
  const dados={loja_id:f.lojaId,vendedor_id:f.vendedorId||null,cliente_id:clienteId||null,cliente:{...f.cliente,nome:f.cliente.nome.trim()},itens,modo:f.modo,frete:f.modo==='retirada'?0:toNum(f.frete),link_pagamento:f.link.trim(),obs:f.obs.trim()};
  const r=f.id?await gravar(()=>sb.from('pedidos').update(dados).eq('id',f.id).select().single(),'Pedido atualizado')
              :await gravar(()=>sb.from('pedidos').insert({...dados,historico:[hist('aguardando')]}).select().single(),'Pedido gerado');
  if(r){const p=normPed(r);const i=S.pedidos.findIndex(x=>x.id===p.id);if(i>=0)S.pedidos[i]=p;else S.pedidos.unshift(p);S.atual=p.id;S.view='pedido';S.form=null;render();window.scrollTo(0,0)}
}

async function salvarConvite(){
  const d=S.cv;S.erro='';
  const precisa=d.papel==='gerente'||d.papel==='vendedor';
  const f=foneWa(d.fone);let com=null;
  if(!d.nome.trim())S.erro='Informe o nome.';
  else if(f.length<12||f.length>13)S.erro='Informe o WhatsApp com DDD.';
  else if(precisa&&!d.loja_id)S.erro='Escolha a loja.';
  else if(precisa){
    if(String(d.comissao).trim()==='')S.erro='Informe a comissão.';
    else{com=toNum(d.comissao);
      if(d.papel==='vendedor'&&(com<2||com>5))S.erro='Comissão do vendedor: de 2% a 5%.';
      if(d.papel==='gerente'&&(com<1||com>2))S.erro='Comissão do gerente: de 1% a 2%.'}
  }
  if(S.erro){render();return}
  const args={p_nome:d.nome.trim(),p_fone:f,p_papel:d.papel,p_loja:precisa?d.loja_id:null,p_comissao:com};
  const r=await gravar(()=>d.id?sb.rpc('editar_convite',{p_id:d.id,...args}):sb.rpc('criar_convite',args),'Convite salvo');
  if(r){S.cv=null;await carregarConvites();render()}

async function chamaConvite(body){
  try{
    const r=await fetch(`${SUPABASE_URL}/functions/v1/convite`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    return r.ok?{ok:true,...j}:{ok:false,erro:j.erro||'Não foi possível concluir. Tente de novo.'};
  }catch(e){return{ok:false,erro:'Sem conexão. Tente de novo.'}}

async function salvarPerfil(id){
  const d=S.eq[id],p=S.perfis.find(x=>x.id===id);if(!d||!p)return;
  if(p.status==='pendente'&&d.status==='pendente')d.status='ativo';
  const temCom=d.papel==='gerente'||d.papel==='vendedor';
  if(temCom&&!d.loja_id){toast('Escolha a loja do '+PAPEIS[d.papel].toLowerCase()+'.');return}
  let com=null;
  if(temCom){if(String(d.comissao).trim()===''){toast('Informe a comissão.');return}com=toNum(d.comissao);
    if(d.papel==='vendedor'&&(com<2||com>5)){toast('Comissão do vendedor: de 2% a 5%.');return}
    if(d.papel==='gerente'&&(com<1||com>2)){toast('Comissão do gerente: de 1% a 2%.');return}}
  const upd={nome:d.nome.trim(),comissao:com,loja_id:d.loja_id||null};
  if(id!==S.uid){upd.papel=d.papel;upd.status=d.status}
  const r=await gravar(()=>sb.from('perfis').update(upd).eq('id',id).select().single(),`${upd.nome||'Cadastro'} salvo`);
  if(r){const i=S.perfis.findIndex(x=>x.id===id);S.perfis[i]=normPerfil(r);delete S.eq[id];if(id===S.uid)S.perfil=normPerfil(r);render()}
}

async function salvarLoja(id){
  const d=S.lj[id];if(!d)return;
  if(!d.nome.trim()||!d.sigla.trim()){toast('Informe o nome e a sigla da loja.');return}

  const f=d=>d.toISOString();

  if(error){toast('Não foi possível carregar os resultados.');S.res=[];S.resPrev=[];S.resCriados=[]}

function validaCliente(c){
  if(!String(c.nome||'').trim())return'Informe o nome do cliente.';
  if(foneWa(c.fone).length<12)return'Informe o WhatsApp do cliente com DDD.';
  const cpf=String(c.cpf||'').replace(/\D/g,'');if(cpf&&cpf.length!==11)return'O CPF tem 11 dígitos.';
  return'';
}
const dadosCliente=c=>({nome:String(c.nome||'').trim(),fone:c.fone||'',cpf:c.cpf||'',email:String(c.email||'').trim(),nascimento:c.nascimento||null,cep:c.cep||'',endereco:c.endereco||'',bairro:c.bairro||'',cidade:c.cidade||'',obs:c.obs||''});
async function salvarCliente(){
  const c=S.cli;S.erro=validaCliente(c);if(S.erro){render();return}
  const d=dadosCliente(c);
  const r=c.id?await gravar(()=>sb.from('clientes').update(d).eq('id',c.id).select().single(),'Cadastro salvo')
              :await gravar(()=>sb.from('clientes').insert({...d,loja_id:c.loja_id,vendedor_id:c.vendedor_id}).select().single(),'Cliente cadastrado');
  if(r){const i=S.clientes.findIndex(x=>x.id===r.id);if(i>=0)S.clientes[i]=r;else S.clientes.push(r);S.clientes.sort((a,b)=>a.nome.localeCompare(b.nome));S.cli={...r,nascimento:r.nascimento||''};render()}
}

  render();

/* CEP: preenche endereço pelo ViaCEP */
async function buscaCep(cep,alvo){
  const d=String(cep).replace(/\D/g,'');if(d.length!==8)return;
  try{const r=await fetch(`https://viacep.com.br/ws/${d}/json/`);const j=await r.json();if(j.erro)return;
    const set=(k,v)=>{if(!v)return;if(alvo==='form'){if(!S.form.cliente[k]){S.form.cliente[k]=v;const el=$('#f-'+({endereco:'end',bairro:'bairro',cidade:'cidade'}[k]));if(el)el.value=v}}else if(S.cli&&!S.cli[k]){S.cli[k]=v;const el=$('#c-'+k);if(el)el.value=v}};
    if(alvo==='form'&&S.form){const ant=S.form.cliente.cidade;if(ant==='Rio de Janeiro'&&j.localidade&&j.localidade!==ant){S.form.cliente.cidade='';}}
    if(alvo==='cli'&&S.cli&&S.cli.cidade==='Rio de Janeiro'&&j.localidade!=='Rio de Janeiro')S.cli.cidade='';
    set('endereco',j.logradouro?j.logradouro+', ':'');set('bairro',j.bairro);set('cidade',j.localidade);
    const el=alvo==='form'?$('#f-end'):$('#c-endereco');if(el&&j.logradouro){el.focus();el.setSelectionRange(el.value.length,el.value.length)}
  }catch(e){}
}

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='cli-busca'){S.cliBusca=t.value;const pos=t.selectionStart;render();const b=$('#cli-busca');if(b){b.focus();try{b.setSelectionRange(pos,pos)}catch(e){}}return}
  if(t.id==='f-bcli'){S.cliBuscaForm=t.value;mostraSugestoes(t.value);return}
  if(t.dataset.cf&&S.cli){S.cli[t.dataset.cf]=t.value;if(t.dataset.cf==='cep')buscaCep(t.value,'cli');return}
  if(t.id==='busca'){S.busca=t.value;const pos=t.selectionStart;render();const b=$('#busca');if(b){b.focus();try{b.setSelectionRange(pos,pos)}catch(e){}}return}
  if(S.form){
    if(t.dataset.ff){S.form[t.dataset.ff]=t.value;if(t.dataset.ff==='frete')atualizaTotais();return}
    if(t.dataset.fc){S.form.cliente[t.dataset.fc]=t.value;if(t.dataset.fc==='cep')buscaCep(t.value,'form');return}
    if(t.dataset.fi){S.form.itens[+t.dataset.i][t.dataset.fi]=t.value;atualizaTotais();return}
  }
  if(t.dataset.cv&&S.cv){S.cv[t.dataset.cv]=t.value;return}
  if(t.dataset.pe){S.eq[t.dataset.pe][t.dataset.pf]=t.value;return}
  if(t.dataset.le&&t.type!=='checkbox'){S.lj[t.dataset.le][t.dataset.lf]=t.value;return}
  if(t.id&&t.id.startsWith('p-'))t.dataset.dirty='1';
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(S.form&&t.dataset.ff==='lojaId'){S.form.lojaId=t.value;if(!vendedoresDaLoja(t.value).some(p=>p.id===S.form.vendedorId))S.form.vendedorId='';render();return}
  if(S.form&&t.dataset.ff==='vendedorId'){S.form.vendedorId=t.value;return}
  if(t.dataset.cv&&S.cv){S.cv[t.dataset.cv]=t.value;if(t.dataset.cv==='papel'){if(t.value==='proprietario'||t.value==='supervisor'){S.cv.loja_id='';S.cv.comissao=''}render()}return}
  if(t.dataset.pe){S.eq[t.dataset.pe][t.dataset.pf]=t.value;if(t.dataset.pf==='papel')render();return}
  if(t.dataset.le&&t.type==='checkbox'){S.lj[t.dataset.le].ativa=t.checked;return}

});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(ev.target.id==='form-senha'){const s=$('#n-senha').value;if(s.length<6){S.auth.erro='A senha precisa ter pelo menos 6 caracteres.';render();return}
    const{error}=await sb.auth.updateUser({password:s});if(error){S.auth.erro='Não foi possível salvar a senha. Peça um novo link.';render();return}
    S.recuperar=false;S.auth.erro='';history.replaceState(null,'',location.pathname);toast('Senha alterada');render();return}
  if(ev.target.id==='form-conv'){
    const c=S.conv;c.erro='';
    const v={nome:($('#v-nome')?.value||'').trim(),cpf:$('#v-cpf')?.value||'',nascimento:$('#v-nasc')?.value||'',email:($('#v-email')?.value||'').trim()};c.v=v;
    const senha=$('#v-senha').value;
    if(senha.length<6){c.erro='A senha precisa ter no mínimo 6 caracteres.';render();return}
    if(c.info.tipo!=='reset'&&!v.nome){c.erro='Informe seu nome.';render();return}
    const btn=ev.target.querySelector('[type=submit]');btn.disabled=true;
    const r=await chamaConvite({acao:'aceitar',token:c.token,senha,...v});
    if(!r.ok){c.erro=r.erro;render();return}
    S.conv=null;history.replaceState(null,'',location.pathname);
    const{error}=await sb.auth.signInWithPassword({email:r.email,password:senha});
    if(error){S.auth={modo:'entrar',erro:'',ok:'Cadastro concluído. Entre com seu WhatsApp e a senha.'};render()}
    else toast('Bem-vindo ao Fechô');
    return;
  }
  if(ev.target.id!=='form-auth')return;
  const a=S.auth;a.erro='';a.ok='';
  let email=$('#a-email').value.trim();
  if(!email){a.erro=a.modo==='entrar'?'Informe o e-mail ou o WhatsApp.':'Informe o e-mail.';render();return}
  const porFone=!email.includes('@');
  if(porFone){
    const d=foneWa(email);
    if(a.modo!=='entrar'){a.erro='Informe um e-mail válido.';render();return}
    if(d.length<12||d.length>13){a.erro='Informe o WhatsApp com DDD, ou o e-mail.';render();return}
    email=emailDoFone(d);
  }
  const btn=ev.target.querySelector('[type=submit]');btn.disabled=true;
  try{
    if(a.modo==='entrar'){
      const{error}=await sb.auth.signInWithPassword({email,password:$('#a-senha').value});
      if(error)a.erro=error.message.includes('confirm')?'Confirme seu e-mail pelo link que enviamos antes de entrar.':'E-mail, WhatsApp ou senha incorretos.';
    }else if(a.modo==='criar'){
      const nome=$('#a-nome').value.trim(),senha=$('#a-senha').value,loja=$('#a-loja').value;
      if(!nome){a.erro='Informe seu nome.'}else if(senha.length<6){a.erro='A senha precisa ter pelo menos 6 caracteres.'}
      else{const{data,error}=await sb.auth.signUp({email,password:senha,options:{data:{nome,loja_id:loja},emailRedirectTo:location.origin}});
        if(error)a.erro=error.message.includes('registered')?'Este e-mail já tem conta. Use Entrar.':'Não foi possível criar a conta: '+error.message;
        else if(!data.session){a.ok='Conta criada. Abra o e-mail que enviamos e confirme o endereço para entrar.';a.modo='entrar'}}
    }else{
      const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
      if(error)a.erro='Não foi possível enviar o link. Tente de novo em alguns minutos.';else a.ok='Se o e-mail tiver conta, o link para nova senha chega em instantes.';
    }
  }finally{btn.disabled=false}
  render();
});

    case'avancar':await avancar(p,b.dataset.s);break;
    case'registrar-nf':{const numero=$('#p-nfnum').value.trim();if(!numero){toast('Informe o número da nota fiscal.');break}const chave=$('#p-nfchave').value.replace(/\D/g,'');if(chave&&chave.length!==44){toast('A chave de acesso tem 44 dígitos.');break}await avancar(p,'faturado',{nf:{numero,chave,link:$('#p-nflink').value.trim()}});break}
    case'registrar-coleta':await avancar(p,'coletado',{entrega:{app:$('#p-app').value,entregador:$('#p-entregador').value.trim(),codigo:$('#p-cod').value.trim(),link:$('#p-rast').value.trim(),coletado_em:nowIso()}});break;
    case'cancelar':S.confirmaCancel=true;render();break;
    case'cancelar-nao':S.confirmaCancel=false;render();break;
    case'cancelar-sim':await avancar(p,'cancelado');break;
    case'ajuda-voltar':S.view='painel';render();window.scrollTo(0,0);break;
    case'res-loja':S.resLoja=b.dataset.id;render();window.scrollTo(0,0);break;
    case'res-voltar':S.resLoja=null;render();break;
    case'abrir-cli':{const c=S.clientes.find(x=>x.id===b.dataset.id);if(!c)break;S.cli={...c,fone:foneFmt(c.fone),cpf:cpfFmt(c.cpf),nascimento:c.nascimento||''};S.erro='';S.view='cliente';render();window.scrollTo(0,0);break}
    case'novo-cli':S.cli=novoCli();S.erro='';S.view='cliente';render();window.scrollTo(0,0);break;
    case'salvar-cli':await salvarCliente();break;
    case'pedido-cli':{const id=S.cli&&S.cli.id;if(!id)break;S.form=novoForm();if(veTodas()){S.form.lojaId=S.cli.loja_id;S.form.vendedorId=S.cli.vendedor_id&&vendedoresDaLoja(S.cli.loja_id).some(x=>x.id===S.cli.vendedor_id)?S.cli.vendedor_id:''}S.erro='';S.view='novo';usarCliente(id);window.scrollTo(0,0);break}
    case'usar-cli':usarCliente(b.dataset.id);break;
    case'trocar-cli':S.form.clienteId=null;S.form.cliente={nome:'',fone:'',cpf:'',email:'',cep:'',endereco:'',bairro:'',cidade:'Rio de Janeiro'};render();{const el=$('#f-bcli');if(el)el.focus()}break;
    case'salvar-perfil':await salvarPerfil(b.dataset.id);break;
    case'add-loja':S.lj['novo-'+Date.now()]={nome:'',marca:'Flamengo',sigla:'',ativa:true};render();break;
    case'salvar-loja':await salvarLoja(b.dataset.id);break;
  }
});

/* ===== início ===== */
setTimeout(checaVersao,3000);setInterval(checaVersao,300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checaVersao()});
{const t=new URLSearchParams(location.search).get('c');if(t&&/^[0-9a-f]{64}$/.test(t)){S.conv={token:t,estado:'carregando'};abreConvite()}}
sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY'){S.recuperar=true;S.auth.erro=''}
  const novo=session?.user?.id||null;
  if(novo!==S.uid){
    S.uid=novo;S.email=session?.user?.email||'';
    S.perfil=null;S.pedidos=[];S.perfis=[];S.view='painel';S.loja='todas';S.etapa='ativos';S.form=null;S.res=null;S.resMes=null;S.resLoja=null;S.clientes=[];S.cli=null;
    if(canal){sb.removeChannel(canal);canal=null}
    if(novo)setTimeout(carregarTudo,0);else{S.carregado=false;setTimeout(async()=>{await carregarLojas();render()},0)}
  }
  render();
});
</script>
